<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Still Dizzy... ❤️</title>

<style>

/* =========================================================
   PAGE 4 — CHAMPAGNE BLUSH PALETTE
========================================================= */

:root {
    --dark: #190B12;
    --wine: #6D1F3B;
    --blush: #E9A0B5;
    --soft: #FFEFF4;

    --white: #FFFDFE;
    --rose: #D85C7A;
    --deep-rose: #9E294C;
    --champagne: #C9A96E;

    --text-dark: #4A1728;
    --text-soft: #8C5266;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: var(--dark);

    cursor: pointer;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================================================
   MAIN SCREEN
========================================================= */

#wakeScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(109,31,59,.28),
            transparent 45%
        ),

        linear-gradient(
            135deg,
            #190B12,
            #240D18
        );

    transition:
        background 2s ease;
}


/* =========================================================
   SOFT ROOM LIGHT
========================================================= */

.room-light {

    position: absolute;

    width: 75vmin;
    height: 75vmin;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(233,160,181,.18),
            rgba(109,31,59,.08),
            transparent 70%
        );

    filter: blur(35px);

    animation:
        roomBreath
        5s
        ease-in-out
        infinite alternate;

    pointer-events: none;
}


@keyframes roomBreath {

    from {
        transform:
            translate(-50%, -50%)
            scale(.8);

        opacity: .45;
    }

    to {
        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: .9;
    }
}


/* =========================================================
   CIRCULAR DIZZY EFFECT
========================================================= */

.dizzy-container {

    position: absolute;

    width: 100%;
    height: 100%;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    pointer-events: none;

    z-index: 3;

    transition:
        opacity 3s ease;
}


/* Main ring */

.dizzy-ring {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 78vmin;
    height: 78vmin;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(233,160,181,.18);

    box-shadow:

        0 0 70px
        rgba(109,31,59,.14),

        inset 0 0 50px
        rgba(233,160,181,.05);

    animation:
        dizzySpin
        7s
        linear
        infinite;
}


/* Second ring */

.dizzy-ring::before {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 50%;

    border:
        1px solid
        rgba(201,169,110,.14);

    animation:
        dizzyReverse
        5s
        linear
        infinite;
}


/* Third ring */

.dizzy-ring::after {

    content: "";

    position: absolute;

    inset: 20%;

    border-radius: 50%;

    border:
        1px dashed
        rgba(233,160,181,.12);

    animation:
        dizzySpin
        3.5s
        linear
        infinite;
}


@keyframes dizzySpin {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


@keyframes dizzyReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* =========================================================
   DIZZY LIGHT STREAKS
========================================================= */

.dizzy-streak {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 110vmin;
    height: 110vmin;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        2px solid transparent;

    border-top-color:
        rgba(233,160,181,.12);

    border-right-color:
        rgba(109,31,59,.12);

    filter: blur(3px);

    animation:
        streakSpin
        4s
        linear
        infinite;
}


@keyframes streakSpin {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg)
            scale(1);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(-360deg)
            scale(1);
    }
}


/* =========================================================
   FLOATING LIGHT PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;

    z-index: 4;

    pointer-events: none;
}


.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background:
        var(--blush);

    box-shadow:
        0 0 12px
        rgba(233,160,181,.7);

    opacity: 0;

    animation:
        floatParticle
        linear
        infinite;
}


.particle:nth-child(1) {
    left: 10%;
    bottom: -5%;
    animation-duration: 10s;
}

.particle:nth-child(2) {
    left: 24%;
    bottom: -5%;
    animation-duration: 13s;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    left: 42%;
    bottom: -5%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.particle:nth-child(4) {
    left: 66%;
    bottom: -5%;
    animation-duration: 12s;
    animation-delay: 3s;
}

.particle:nth-child(5) {
    left: 85%;
    bottom: -5%;
    animation-duration: 11s;
    animation-delay: 1s;
}


@keyframes floatParticle {

    0% {

        transform:
            translateY(0)
            scale(.3);

        opacity: 0;
    }

    20% {
        opacity: .5;
    }

    70% {
        opacity: .25;
    }

    100% {

        transform:
            translateY(-110vh)
            translateX(35px)
            scale(1);

        opacity: 0;
    }
}


/* =========================================================
   VISION / ROOM BLUR
========================================================= */

.vision-layer {

    position: absolute;

    inset: -20px;

    z-index: 10;

    background:

        radial-gradient(
            circle at center,
            rgba(25,11,18,.45),
            rgba(25,11,18,.96)
        );

    backdrop-filter:
        blur(28px);

    -webkit-backdrop-filter:
        blur(28px);

    opacity: 1;

    transition:

        opacity 1.8s cubic-bezier(.22,.61,.36,1),

        backdrop-filter 1.8s ease,

        -webkit-backdrop-filter 1.8s ease;

    pointer-events: none;
}


/* =========================================================
   EXTRA SOFT BLUR
========================================================= */

.blur-haze {

    position: absolute;

    inset: 0;

    z-index: 9;

    background:

        radial-gradient(
            ellipse at center,
            rgba(233,160,181,.06),
            transparent 55%
        );

    filter: blur(20px);

    opacity: 1;

    transition:
        opacity 2s ease;

    pointer-events: none;
}


/* =========================================================
   VIGNETTE
========================================================= */

.vignette {

    position: absolute;

    inset: 0;

    z-index: 18;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 28%,
            rgba(25,11,18,.7) 100%
        );

    transition:
        opacity 2s ease;
}


/* =========================================================
   DIALOGUE CONTENT
========================================================= */

.wake-content {

    position: relative;

    z-index: 25;

    width:
        min(90%, 700px);

    padding: 30px;

    pointer-events: none;
}


/* =========================================================
   SMALL CINEMATIC LABEL
========================================================= */

.eyebrow {

    color:
        rgba(233,160,181,.72);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 24px;

    opacity: 0;

    animation:
        eyebrowAppear
        2s
        ease
        1s
        forwards;
}


@keyframes eyebrowAppear {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: .72;
        transform: translateY(0);
    }
}


/* =========================================================
   DIALOGUE
========================================================= */

.dialogue {

    min-height: 120px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.dialogue h1 {

    color:
        var(--soft);

    font-size:
        clamp(
            30px,
            8vw,
            58px
        );

    font-weight: 500;

    line-height: 1.16;

    letter-spacing: .2px;

    text-shadow:

        0 0 25px
        rgba(233,160,181,.18),

        0 4px 30px
        rgba(0,0,0,.35);

    opacity: 0;

    filter: blur(9px);

    transform:
        translateY(18px);

    animation:
        firstDialogue
        1.7s
        cubic-bezier(.22,.61,.36,1)
        1.5s
        forwards;
}


@keyframes firstDialogue {

    0% {

        opacity: 0;

        filter: blur(12px);

        transform:
            translateY(18px)
            scale(.97);
    }

    60% {

        opacity: .75;

        filter: blur(3px);
    }

    100% {

        opacity: 1;

        filter: blur(0);

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TAP HINT
========================================================= */

.tap-hint {

    margin-top: 34px;

    color:
        rgba(233,160,181,.7);

    font-size: 10px;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    opacity: 0;

    animation:
        hintAppear
        1.5s
        ease
        3s
        forwards;
}


@keyframes hintAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: .75;
    }
}


.tap-hint.pulse {

    animation:
        hintPulse
        2s
        ease-in-out
        infinite;
}


@keyframes hintPulse {

    0%,
    100% {
        opacity: .35;
    }

    50% {
        opacity: .9;
    }
}


/* =========================================================
   TAP FLASH
========================================================= */

.tap-flash {

    position: fixed;

    inset: 0;

    z-index: 40;

    pointer-events: none;

    background:

        radial-gradient(
            circle at center,
            rgba(255,255,255,.3),
            rgba(233,160,181,.1),
            transparent 60%
        );

    opacity: 0;
}


.tap-flash.active {

    animation:
        tapFlash
        .6s
        ease;
}


@keyframes tapFlash {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   CINEMATIC RING TRANSITION
========================================================= */

.transition-ring {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    border:
        1px solid
        rgba(233,160,181,.7);

    box-shadow:
        0 0 30px
        rgba(233,160,181,.25);

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    z-index: 50;

    pointer-events: none;
}


.transition-ring.active {

    animation:
        expandRing
        1.8s
        ease
        forwards;
}


@keyframes expandRing {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(140);

        opacity: 0;
    }
}


/* =========================================================
   FINAL WHITE GLOW
========================================================= */

.final-glow {

    position: fixed;

    inset: 0;

    z-index: 45;

    background:
        radial-gradient(
            circle,
            rgba(255,239,244,.5),
            rgba(233,160,181,.12),
            transparent 65%
        );

    opacity: 0;

    pointer-events: none;
}


.final-glow.active {

    animation:
        finalGlow
        1.5s
        ease
        forwards;
}


@keyframes finalGlow {

    0% {
        opacity: 0;
    }

    40% {
        opacity: .75;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:500px) {

    .wake-content {
        padding: 20px;
    }

    .eyebrow {
        letter-spacing: 3px;
    }

    .dizzy-ring {
        width: 95vmin;
        height: 95vmin;
    }

    .dizzy-streak {
        width: 125vmin;
        height: 125vmin;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     WAKE SCREEN
========================================================= -->

<section id="wakeScreen">


    <!-- Soft room illumination -->

    <div class="room-light"></div>


    <!-- Circular dizziness -->

    <div class="dizzy-container">

        <div class="dizzy-ring"></div>

        <div class="dizzy-streak"></div>

    </div>


    <!-- Floating particles -->

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <!-- Extra haze -->

    <div
        class="blur-haze"
        id="blurHaze">
    </div>


    <!-- Vision obstruction -->

    <div
        class="vision-layer"
        id="visionLayer">
    </div>


    <!-- Vignette -->

    <div
        class="vignette"
        id="vignette">
    </div>


    <!-- Dialogue -->

    <div class="wake-content">

        <div class="eyebrow">
            Somewhere between midnight & forever
        </div>


        <div class="dialogue">

            <h1 id="dialogueText">
                Oh God... I'm still dizzy... 😵‍💫
            </h1>

        </div>


        <div
            class="tap-hint"
            id="tapHint">

            Tap anywhere...

        </div>

    </div>


</section>


<!-- =========================================================
     EFFECTS
========================================================= -->

<div
    class="tap-flash"
    id="tapFlash">
</div>


<div
    class="transition-ring"
    id="transitionRing">
</div>


<div
    class="final-glow"
    id="finalGlow">
</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const wakeScreen =
    document.getElementById("wakeScreen");

const visionLayer =
    document.getElementById("visionLayer");

const blurHaze =
    document.getElementById("blurHaze");

const vignette =
    document.getElementById("vignette");

const dialogueText =
    document.getElementById("dialogueText");

const tapHint =
    document.getElementById("tapHint");

const tapFlash =
    document.getElementById("tapFlash");

const transitionRing =
    document.getElementById("transitionRing");

const finalGlow =
    document.getElementById("finalGlow");

const dizzyContainer =
    document.querySelector(".dizzy-container");

const dizzyRing =
    document.querySelector(".dizzy-ring");

const dizzyStreak =
    document.querySelector(".dizzy-streak");


/* =========================================================
   STATE
========================================================= */

let tapCount = 0;

let audioContext = null;


/* =========================================================
   DIALOGUE
========================================================= */

const dialogues = [

    "Oh God... I'm still dizzy... 😵‍💫",

    "Riteshhhhhhh!!! Babe!!!! ❤️",

    "Babyyyy!!! Where are you...? 🥺",

    "Where are you hiding, Ritesh...? ❤️"

];


/* =========================================================
   AUDIO CONTEXT
========================================================= */

function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        audioContext =
            new AudioContext();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    return audioContext;
}


/* =========================================================
   SOFT TAP SOUND
========================================================= */

function playTapSound() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        430,
        ctx.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        620,
        ctx.currentTime + .08
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .045,
        ctx.currentTime + .02
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .24
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + .24
    );
}


/* =========================================================
   DIZZY WHOOSH
========================================================= */

function playDizzyWhoosh() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        220,
        ctx.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        55,
        ctx.currentTime + .8
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .065,
        ctx.currentTime + .12
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .85
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + .85
    );
}


/* =========================================================
   ROMANTIC CHIME
========================================================= */

function playChime() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const notes = [
        392,
        523,
        659
    ];


    notes.forEach(
        (frequency, index) => {

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            const start =
                ctx.currentTime +
                index * .10;


            oscillator.type =
                "sine";

            oscillator.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                .0001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .04,
                start + .03
            );


            gain.gain.exponentialRampToValueAtTime(
                .0001,
                start + .55
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start + .55
            );

        }
    );
}


/* =========================================================
   SUBTLE HEARTBEAT
========================================================= */

function heartbeat() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    function beat(delay, volume) {

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();


        oscillator.type =
            "sine";

        oscillator.frequency.value =
            70;


        const start =
            ctx.currentTime +
            delay;


        gain.gain.setValueAtTime(
            .0001,
            start
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            start + .04
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            start + .18
        );


        oscillator.connect(gain);

        gain.connect(
            ctx.destination
        );


        oscillator.start(start);

        oscillator.stop(
            start + .2
        );
    }


    beat(0, .035);
    beat(.16, .025);
}


/* =========================================================
   BREATHING SOUND
========================================================= */

function breathingSound() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";

    oscillator.frequency.value =
        110;


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.linearRampToValueAtTime(
        .012,
        ctx.currentTime + 1
    );


    gain.gain.linearRampToValueAtTime(
        .0001,
        ctx.currentTime + 2.2
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + 2.3
    );
}


/* =========================================================
   FLASH
========================================================= */

function flashScreen() {

    tapFlash.classList.remove(
        "active"
    );

    void tapFlash.offsetWidth;

    tapFlash.classList.add(
        "active"
    );
}


/* =========================================================
   DIALOGUE TRANSITION
========================================================= */

function changeDialogue(text) {

    dialogueText.style.transition =
        "opacity .35s ease, transform .35s ease, filter .35s ease";

    dialogueText.style.opacity =
        "0";

    dialogueText.style.filter =
        "blur(8px)";

    dialogueText.style.transform =
        "translateY(14px)";


    setTimeout(() => {

        dialogueText.textContent =
            text;


        dialogueText.style.opacity =
            "1";

        dialogueText.style.filter =
            "blur(0)";

        dialogueText.style.transform =
            "translateY(0)";

    }, 350);
}


/* =========================================================
   VISION LEVELS
========================================================= */

function revealVision(level) {


    if (level === 1) {

        /* First tap */

        wakeScreen.style.background =

            "radial-gradient(circle at 50% 50%, rgba(109,31,59,.35), transparent 48%), linear-gradient(135deg, #24101A, #3A1423)";


        visionLayer.style.opacity =
            ".68";


        blurHaze.style.opacity =
            ".8";


        vignette.style.opacity =
            ".85";
    }


    else if (level === 2) {

        /* Second tap */

        wakeScreen.style.background =

            "radial-gradient(circle at 50% 50%, rgba(233,160,181,.28), transparent 50%), linear-gradient(135deg, #6D1F3B, #A94A67)";


        visionLayer.style.opacity =
            ".34";


        blurHaze.style.opacity =
            ".4";


        vignette.style.opacity =
            ".55";
    }


    else if (level === 3) {

        /* Final wake */

        wakeScreen.style.background =

            "radial-gradient(circle at 50% 20%, rgba(255,255,255,.9), transparent 40%), linear-gradient(135deg, #E9A0B5, #FFEFF4)";


        visionLayer.style.opacity =
            "0";


        blurHaze.style.opacity =
            "0";


        vignette.style.opacity =
            ".12";


        /* Slow down dizziness */

        dizzyRing.style.animationDuration =
            "22s";

        dizzyStreak.style.animationDuration =
            "18s";

        dizzyContainer.style.opacity =
            ".35";
    }
}


/* =========================================================
   INITIAL ATMOSPHERE
========================================================= */

setTimeout(() => {

    try {
        heartbeat();
        breathingSound();
    } catch (e) {}

}, 1200);


/* =========================================================
   FULL SCREEN TAP
========================================================= */

wakeScreen.addEventListener(
    "click",
    () => {

        /* Prevent extra taps after final state */

        if (tapCount >= 3) {
            return;
        }


        tapCount++;


        playTapSound();

        flashScreen();


        /* =========================================
           FIRST TAP
        ========================================= */

        if (tapCount === 1) {

            playDizzyWhoosh();

            revealVision(1);

            changeDialogue(
                dialogues[1]
            );


            tapHint.textContent =
                "Tap again...";


            tapHint.classList.add(
                "pulse"
            );
        }


        /* =========================================
           SECOND TAP
        ========================================= */

        else if (tapCount === 2) {

            playChime();

            revealVision(2);

            changeDialogue(
                dialogues[2]
            );


            tapHint.textContent =
                "Almost there...";
        }


        /* =========================================
           THIRD TAP
        ========================================= */

        else if (tapCount === 3) {

            playChime();

            revealVision(3);

            changeDialogue(
                dialogues[3]
            );


            tapHint.textContent =
                "I'm awake... ❤️";


            tapHint.classList.remove(
                "pulse"
            );


            /*
                Let the final state breathe.
            */

            setTimeout(() => {

                finalGlow.classList.add(
                    "active"
                );

            }, 700);


            /*
                Cinematic circular
                transition pulse.
            */

            setTimeout(() => {

                transitionRing.classList.add(
                    "active"
                );

            }, 1100);

        }

    }
);


/* =========================================================
   PREVENT CONTEXT MENU
========================================================= */

wakeScreen.addEventListener(
    "contextmenu",
    event => {
        event.preventDefault();
    }
);

</script>

</body>
