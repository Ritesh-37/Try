<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Still Dizzy... ❤️</title>

<style>

/* =========================================================
   CHAMPAGNE LUXURY PALETTE
========================================================= */

:root {
    --black: #0F080A;
    --wine: #2A1118;
    --deep-wine: #4A1829;
    --champagne: #C9A96E;
    --gold-light: #E7C98A;
    --blush: #E9A0B5;
    --cream: #FFF5E6;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: var(--black);
    color: var(--cream);

    cursor: pointer;
}


/* =========================================================
   WAKE SCREEN
========================================================= */

#wakeScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(74, 24, 41, .45),
            transparent 42%
        ),

        radial-gradient(
            circle at 20% 80%,
            rgba(201, 169, 110, .08),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #0F080A,
            #241018,
            #0F080A
        );
}


/* =========================================================
   CINEMATIC VIGNETTE
========================================================= */

#wakeScreen::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;

    background:

        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(0,0,0,.78) 100%
        );
}


/* =========================================================
   AMBIENT CHAMPAGNE LIGHT
========================================================= */

.ambient-light {

    position: absolute;

    width: 70vw;
    height: 70vw;

    max-width: 800px;
    max-height: 800px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(201,169,110,.15),
            transparent 68%
        );

    filter: blur(50px);

    animation:
        ambientBreath
        6s
        ease-in-out
        infinite
        alternate;

    pointer-events: none;
}


@keyframes ambientBreath {

    from {
        transform: scale(.8);
        opacity: .45;
    }

    to {
        transform: scale(1.15);
        opacity: .9;
    }
}


/* =========================================================
   DIZZY CIRCULAR MOTION
========================================================= */

.dizzy-ring {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 75vmin;
    height: 75vmin;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:

        1px solid
        rgba(201,169,110,.13);

    opacity: .75;

    pointer-events: none;

    animation:
        dizzySpin
        10s
        linear
        infinite;
}


.dizzy-ring::before {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 50%;

    border:

        1px solid
        rgba(233,160,181,.10);

    animation:
        dizzySpinReverse
        7s
        linear
        infinite;
}


.dizzy-ring::after {

    content: "";

    position: absolute;

    inset: 20%;

    border-radius: 50%;

    border:

        1px dashed
        rgba(201,169,110,.10);

    animation:
        dizzySpin
        5s
        linear
        infinite;
}


@keyframes dizzySpin {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


@keyframes dizzySpinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* =========================================================
   FLOATING CHAMPAGNE PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;
}


.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: var(--champagne);

    box-shadow:
        0 0 10px rgba(201,169,110,.8);

    opacity: 0;

    animation:
        floatUp
        linear
        infinite;
}


.particle:nth-child(1) {
    left: 12%;
    bottom: -5%;
    animation-duration: 9s;
}

.particle:nth-child(2) {
    left: 27%;
    bottom: -5%;
    animation-duration: 12s;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    left: 45%;
    bottom: -5%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.particle:nth-child(4) {
    left: 63%;
    bottom: -5%;
    animation-duration: 11s;
    animation-delay: 4s;
}

.particle:nth-child(5) {
    left: 81%;
    bottom: -5%;
    animation-duration: 10s;
    animation-delay: 2s;
}


@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            scale(.4);

        opacity: 0;
    }

    20% {
        opacity: .45;
    }

    70% {
        opacity: .25;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(35px)
            scale(1);

        opacity: 0;
    }
}


/* =========================================================
   ROOM / VISIBILITY VEIL
========================================================= */

.blur-layer {

    position: absolute;

    inset: -10px;

    z-index: 10;

    background:

        radial-gradient(
            circle at 50% 50%,
            rgba(42,17,24,.75),
            rgba(15,8,10,.99)
        );

    backdrop-filter: blur(28px);

    -webkit-backdrop-filter: blur(28px);

    opacity: 1;

    transition:

        opacity 1.8s ease,
        backdrop-filter 1.5s ease,
        -webkit-backdrop-filter 1.5s ease;

    pointer-events: none;
}


/* =========================================================
   WAKE CONTENT
========================================================= */

.wake-content {

    position: relative;

    z-index: 15;

    width: min(90%, 650px);

    padding: 30px;

    transition:
        opacity .8s ease,
        transform .8s ease;
}


/* =========================================================
   SMALL GOLD LABEL
========================================================= */

.eyebrow {

    color: var(--champagne);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 22px;

    opacity: .65;
}


/* =========================================================
   MAIN DIALOGUE
========================================================= */

.dialogue {

    min-height: 100px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.dialogue h1 {

    color: var(--cream);

    font-size:
        clamp(
            31px,
            8vw,
            58px
        );

    font-weight: 500;

    line-height: 1.15;

    letter-spacing: .3px;

    text-shadow:

        0 0 20px
        rgba(201,169,110,.15),

        0 0 40px
        rgba(233,160,181,.08);

    animation:
        textAppear
        1.2s
        ease forwards;
}


@keyframes textAppear {

    from {

        opacity: 0;

        transform:
            translateY(15px)
            scale(.97);

        filter: blur(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}


/* =========================================================
   TAP HINT
========================================================= */

.tap-hint {

    margin-top: 35px;

    color:
        rgba(
            233,
            160,
            181,
            .7
        );

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    animation:
        hintPulse
        2s
        ease-in-out
        infinite;
}


@keyframes hintPulse {

    0%,
    100% {
        opacity: .35;
    }

    50% {
        opacity: .9;
    }
}


/* =========================================================
   TAP FLASH
========================================================= */

.tap-flash {

    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(255,245,230,.12),
            transparent 55%
        );

    opacity: 0;

    pointer-events: none;

    z-index: 30;
}


.tap-flash.active {

    animation:
        tapFlash
        .55s
        ease;
}


@keyframes tapFlash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   TRANSITION SWIRL
========================================================= */

.transition-ring {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    border:
        1px solid
        var(--champagne);

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    pointer-events: none;

    z-index: 50;
}


.transition-ring.active {

    animation:
        expandRing
        1.4s
        ease
        forwards;
}


@keyframes expandRing {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    25% {
        opacity: .8;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(160);

        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 500px) {

    .wake-content {
        padding: 20px;
    }

    .eyebrow {
        letter-spacing: 3px;
    }

    .dizzy-ring {
        width: 95vmin;
        height: 95vmin;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     WAKE SCREEN
========================================================= -->

<section id="wakeScreen">


    <!-- Ambient champagne light -->

    <div class="ambient-light"></div>


    <!-- Circular dizzy effect -->

    <div class="dizzy-ring"></div>


    <!-- Floating particles -->

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <!-- Dark / blurred room -->

    <div
        class="blur-layer"
        id="blurLayer"
    ></div>


    <!-- Dialogue -->

    <div class="wake-content">

        <div class="eyebrow">
            Somewhere between midnight & forever
        </div>

        <div class="dialogue">

            <h1 id="dialogueText">
                Oh God! I'm still dizzy... 😵‍💫
            </h1>

        </div>

        <div
            class="tap-hint"
            id="tapHint"
        >
            Tap anywhere to wake up
        </div>

    </div>


</section>


<!-- =========================================================
     EFFECT LAYERS
========================================================= -->

<div
    class="tap-flash"
    id="tapFlash"
></div>


<div
    class="transition-ring"
    id="transitionRing"
></div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const wakeScreen =
    document.getElementById("wakeScreen");

const blurLayer =
    document.getElementById("blurLayer");

const dialogueText =
    document.getElementById("dialogueText");

const tapHint =
    document.getElementById("tapHint");

const tapFlash =
    document.getElementById("tapFlash");

const transitionRing =
    document.getElementById("transitionRing");



/* =========================================================
   WAKE STATES
========================================================= */

let tapCount = 0;


/*
    0 = initial
    1 = Riteshhh
    2 = Babyyyy
    3 = completely awake
*/

const dialogueStates = [

    "Oh God! I'm still dizzy... 😵‍💫",

    "Riteshhhhhhh!!! Babe!!!! ❤️",

    "Babyyyy!!! Where are you? 🥺",

    "Where are you hiding, Ritesh...? ❤️"

];



/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        audioContext =
            new AudioContext();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    return audioContext;
}



/* =========================================================
   SOFT TAP SOUND
========================================================= */

function clickSound() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        460,
        ctx.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        680,
        ctx.currentTime + .08
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .055,
        ctx.currentTime + .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .25
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + .25
    );
}



/* =========================================================
   DIZZY WHOOSH
========================================================= */

function dizzyWhoosh() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        180,
        ctx.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        70,
        ctx.currentTime + .7
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .08,
        ctx.currentTime + .12
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .8
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + .8
    );
}



/* =========================================================
   TEXT TRANSITION SOUND
========================================================= */

function transitionSound() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const notes = [
        392,
        523,
        659
    ];


    notes.forEach(
        (frequency, index) => {

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            oscillator.type =
                "sine";

            oscillator.frequency.value =
                frequency;


            const start =
                ctx.currentTime +
                index * .09;


            gain.gain.setValueAtTime(
                .0001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .045,
                start + .03
            );


            gain.gain.exponentialRampToValueAtTime(
                .0001,
                start + .45
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start + .45
            );

        }
    );
}



/* =========================================================
   TAP FLASH
========================================================= */

function flashScreen() {

    tapFlash.classList.remove(
        "active"
    );

    void tapFlash.offsetWidth;

    tapFlash.classList.add(
        "active"
    );
}



/* =========================================================
   CHANGE DIALOGUE
========================================================= */

function changeDialogue(text) {

    dialogueText.style.opacity = "0";

    dialogueText.style.transform =
        "translateY(12px) scale(.98)";

    dialogueText.style.filter =
        "blur(6px)";


    setTimeout(() => {

        dialogueText.textContent =
            text;


        dialogueText.style.transition =
            "all .9s ease";


        dialogueText.style.opacity =
            "1";

        dialogueText.style.transform =
            "translateY(0) scale(1)";

        dialogueText.style.filter =
            "blur(0)";

    }, 250);
}



/* =========================================================
   SCREEN TAP
========================================================= */

wakeScreen.addEventListener(
    "click",
    () => {

        tapCount++;

        clickSound();

        flashScreen();


        /* =========================================
           FIRST TAP
        ========================================= */

        if (tapCount === 1) {

            dizzyWhoosh();

            changeDialogue(
                dialogueStates[1]
            );


            /*
                First layer becomes clearer.
            */

            blurLayer.style.opacity =
                ".68";


            tapHint.textContent =
                "Tap again...";
        }


        /* =========================================
           SECOND TAP
        ========================================= */

        else if (tapCount === 2) {

            transitionSound();

            changeDialogue(
                dialogueStates[2]
            );


            blurLayer.style.opacity =
                ".34";


            tapHint.textContent =
                "Almost there...";
        }


        /* =========================================
           THIRD TAP
        ========================================= */

        else if (tapCount === 3) {

            transitionSound();

            changeDialogue(
                dialogueStates[3]
            );


            blurLayer.style.opacity =
                "0";


            tapHint.textContent =
                "I'm awake... ❤️";


            /*
                Slow the dizziness down
                once she's fully awake.
            */

            document.querySelector(
                ".dizzy-ring"
            ).style.animationDuration =
                "22s";


            /*
                Small cinematic transition.
            */

            setTimeout(() => {

                transitionRing.classList.add(
                    "active"
                );

            }, 900);

        }

    }
);

</script>

</body>
</html>
