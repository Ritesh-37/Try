<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12:37 AM ❤️</title>

<style>

/* =========================================================
   PAGE 4
   WAKE UP → IPHONE → CINEMATIC CHAT → QUIZ
========================================================= */

:root {
    --deepest-red: #260611;
    --deep-red: #3b0718;
    --wine: #570b24;
    --rich-red: #790f31;
    --romantic-red: #a72249;
    --rose: #d94f70;

    --soft-pink: #f3a6ba;
    --cream: #fff3f6;
    --white: #fffafd;

    --text: #3c0d1d;
    --muted: #a66a7c;

    --gold: #c9a96e;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:
        #260611;

    color: var(--cream);

    cursor: pointer;
}


/* =========================================================
   WAKE SCREEN
========================================================= */

#wakeScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(167,34,73,.42),
            transparent 34%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(121,15,49,.75),
            transparent 38%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(167,34,73,.38),
            transparent 34%
        ),

        linear-gradient(
            135deg,
            #260611 0%,
            #570b24 42%,
            #3b0718 72%,
            #19040b 100%
        );

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    z-index: 10;
}


/* =========================================================
   CINEMATIC RED VIGNETTE
========================================================= */

#wakeScreen::before {

    content: "";

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(30,2,10,.35) 75%,
            rgba(15,1,5,.75) 100%
        );

    pointer-events: none;

    z-index: 20;
}


#wakeScreen::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 30% 30%,
            rgba(217,79,112,.12),
            transparent 28%
        ),

        radial-gradient(
            circle at 75% 70%,
            rgba(121,15,49,.25),
            transparent 35%
        );

    animation:
        redBreathing
        7s
        ease-in-out
        infinite alternate;

    pointer-events: none;

    z-index: 2;
}


@keyframes redBreathing {

    from {
        opacity: .55;
        transform: scale(.95);
    }

    to {
        opacity: 1;
        transform: scale(1.08);
    }
}


/* =========================================================
   AMBIENT GLOW
========================================================= */

.ambient-light {

    position: absolute;

    width: 80vw;
    height: 80vw;

    max-width: 900px;
    max-height: 900px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(217,79,112,.25),
            rgba(121,15,49,.18),
            transparent 70%
        );

    filter: blur(45px);

    animation:
        ambientBreath
        6s
        ease-in-out
        infinite alternate;

    pointer-events: none;

    z-index: 1;
}


@keyframes ambientBreath {

    from {
        transform: scale(.8);
        opacity: .55;
    }

    to {
        transform: scale(1.15);
        opacity: 1;
    }
}


/* =========================================================
   DIZZY RINGS
========================================================= */

.dizzy-ring {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 75vmin;
    height: 75vmin;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(217,79,112,.28);

    animation:
        spin
        10s
        linear
        infinite;

    opacity: .7;

    z-index: 3;

    pointer-events: none;
}


.dizzy-ring::before {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 50%;

    border:
        1px solid
        rgba(167,34,73,.38);

    animation:
        reverseSpin
        7s
        linear
        infinite;
}


.dizzy-ring::after {

    content: "";

    position: absolute;

    inset: 20%;

    border-radius: 50%;

    border:
        1px dashed
        rgba(243,166,186,.18);

    animation:
        spin
        5s
        linear
        infinite;
}


@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes reverseSpin {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* =========================================================
   FLOATING PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 5;
}


.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background:
        var(--rose);

    box-shadow:
        0 0 15px
        rgba(217,79,112,.7);

    opacity: 0;

    animation:
        floatUp
        linear
        infinite;
}


.particle:nth-child(1) {
    left: 8%;
    bottom: -5%;
    animation-duration: 11s;
}

.particle:nth-child(2) {
    left: 25%;
    bottom: -5%;
    animation-duration: 13s;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    left: 47%;
    bottom: -5%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.particle:nth-child(4) {
    left: 70%;
    bottom: -5%;
    animation-duration: 12s;
    animation-delay: 3s;
}

.particle:nth-child(5) {
    left: 90%;
    bottom: -5%;
    animation-duration: 10s;
    animation-delay: 1s;
}


@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            scale(.3);

        opacity: 0;
    }

    20% {
        opacity: .6;
    }

    70% {
        opacity: .25;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(35px)
            scale(1);

        opacity: 0;
    }
}


/* =========================================================
   BLUR LAYER
========================================================= */

.blur-layer {

    position: absolute;

    inset: -20px;

    background:

        radial-gradient(
            circle at center,
            rgba(80,8,30,.55),
            rgba(38,6,17,.94)
        );

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    opacity: 1;

    transition:
        opacity 2.3s ease,
        backdrop-filter 2s ease;

    z-index: 10;

    pointer-events: none;
}


/* =========================================================
   WAKE CONTENT
========================================================= */

.wake-content {

    position: relative;

    z-index: 25;

    width:
        min(90%, 700px);

    padding: 30px;
}


.eyebrow {

    color:
        var(--soft-pink);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 22px;

    opacity: .65;
}


.dialogue {

    min-height: 120px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.dialogue h1 {

    color:
        var(--cream);

    font-size:
        clamp(
            30px,
            7vw,
            58px
        );

    font-weight: 500;

    line-height: 1.18;

    text-shadow:
        0 5px 30px
        rgba(0,0,0,.35);

    opacity: 0;

    filter: blur(8px);

    transform:
        translateY(20px)
        scale(.97);
}


.dialogue h1.show {

    animation:
        slowAppear
        1.8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes slowAppear {

    0% {
        opacity: 0;
        filter: blur(10px);
        transform:
            translateY(20px)
            scale(.97);
    }

    55% {
        opacity: .7;
        filter: blur(3px);
    }

    100% {
        opacity: 1;
        filter: blur(0);
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TAP HINT
========================================================= */

.tap-hint {

    margin-top: 32px;

    color:
        #e9a7b9;

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: .45;

    animation:
        hintPulse
        2.4s
        ease-in-out
        infinite;
}


@keyframes hintPulse {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: .75;
    }
}


/* =========================================================
   FLASH
========================================================= */

.tap-flash {

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at center,
            rgba(255,255,255,.65),
            rgba(217,79,112,.16),
            transparent 65%
        );

    opacity: 0;

    pointer-events: none;

    z-index: 1000;
}


.tap-flash.active {

    animation:
        flash
        .6s
        ease;
}


@keyframes flash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   NOTIFICATION SCREEN
========================================================= */

#notificationScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:

        radial-gradient(
            circle at 50% 30%,
            rgba(167,34,73,.55),
            transparent 32%
        ),

        radial-gradient(
            circle at 15% 85%,
            rgba(87,11,36,.8),
            transparent 40%
        ),

        linear-gradient(
            135deg,
            #260611,
            #570b24 45%,
            #3b0718
        );

    opacity: 0;

    visibility: hidden;

    transform: scale(1.05);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;

    z-index: 200;
}


#notificationScreen.active {

    opacity: 1;

    visibility: visible;

    transform: scale(1);
}


/* =========================================================
   LONGER IPHONE
========================================================= */

.notification-phone {

    width:
        min(330px, 82vw);

    aspect-ratio:
        9 / 19.5;

    padding: 10px;

    border-radius: 42px;

    background:
        linear-gradient(
            145deg,
            #303030,
            #080808 55%,
            #1d1d1d
        );

    box-shadow:

        0 45px 100px
        rgba(0,0,0,.55),

        0 15px 40px
        rgba(217,79,112,.2);

    transform:
        translateY(35px)
        scale(.92);

    opacity: 0;

    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);

    cursor: pointer;
}


#notificationScreen.active
.notification-phone {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


.phone-screen {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 34px;

    background:

        radial-gradient(
            circle at 50% 25%,
            rgba(167,34,73,.5),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #5d0c28,
            #210610 70%,
            #100308
        );

    color: white;
}


/* =========================================================
   DYNAMIC ISLAND
========================================================= */

.dynamic-island {

    position: absolute;

    top: 11px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 92px;

    height: 27px;

    border-radius: 30px;

    background:
        #030303;

    z-index: 10;
}


/* =========================================================
   TIME
========================================================= */

.phone-time {

    position: absolute;

    top: 53px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 14px;

    letter-spacing: 1px;

    opacity: .78;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notification {

    position: absolute;

    left: 13px;
    right: 13px;

    top: 112px;

    padding: 18px;

    border-radius: 24px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.3);

    text-align: left;

    animation:
        notificationFloat
        3s
        ease-in-out
        infinite;
}


@keyframes notificationFloat {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-4px);
    }
}


.notification-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 11px;

    font-size: 11px;

    opacity: .7;
}


.notification-name {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 13px;

    font-weight: bold;
}


.notification-icon {

    width: 30px;
    height: 30px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #d94f70,
            #6d0e2c
        );

    box-shadow:
        0 5px 15px
        rgba(217,79,112,.45);
}


.notification-message {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 18px;

    font-weight: 500;
}


.notification-sub {

    margin-top: 6px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;

    opacity: .55;
}


.notification-hint {

    position: absolute;

    bottom: 35px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: .5;

    animation:
        hintPulse
        2s
        ease-in-out
        infinite;
}


/* =========================================================
   PHONE ZOOM
========================================================= */

#notificationScreen.zoom {

    background:
        #050105;

    transition:
        background 1s ease;
}


#notificationScreen.zoom
.notification-phone {

    animation:
        phoneZoom
        1.35s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes phoneZoom {

    0% {
        transform:
            scale(1);
    }

    100% {
        transform:
            scale(4.5);
    }
}


/* =========================================================
   CHAT SCREEN
========================================================= */

#chatScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        #260611;

    opacity: 0;

    visibility: hidden;

    z-index: 500;

    transition:
        opacity 1s ease;
}


#chatScreen.active {

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   CINEMATIC CHAT BACKGROUND
========================================================= */

.chat-background {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 30%,
            rgba(167,34,73,.42),
            transparent 35%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(87,11,36,.7),
            transparent 40%
        ),

        linear-gradient(
            135deg,
            #260611,
            #570b24,
            #3b0718
        );
}


/* =========================================================
   CHAT PHONE FRAME
========================================================= */

.chat-phone {

    position: relative;

    width:
        min(420px, 100vw);

    height:
        min(850px, 100vh);

    overflow: hidden;

    background:
        linear-gradient(
            160deg,
            #fff8fa,
            #f8e9ed
        );

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.5);

    border-radius:
        clamp(0px, 20px, 28px);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    transform:
        scale(.96);

    animation:
        chatReveal
        1s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes chatReveal {

    from {
        opacity: 0;
        transform:
            scale(.9);
    }

    to {
        opacity: 1;
        transform:
            scale(1);
    }
}


/* =========================================================
   CHAT TOP
========================================================= */

.chat-top {

    height: 95px;

    padding:
        35px 20px 10px;

    display: flex;

    align-items: center;

    gap: 12px;

    background:
        rgba(255,250,252,.94);

    border-bottom:
        1px solid
        rgba(87,11,36,.1);

    position: relative;

    z-index: 10;
}


.chat-avatar {

    width: 42px;
    height: 42px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #d94f70,
            #720e2d
        );

    color: white;

    font-family:
        Georgia,
        serif;

    box-shadow:
        0 5px 18px
        rgba(217,79,112,.28);
}


.chat-name {

    color:
        #360c1b;

    font-weight: 600;

    font-size: 15px;
}


.chat-status {

    color:
        #a46777;

    font-size: 10px;

    margin-top: 2px;
}


/* =========================================================
   CHAT MESSAGES AREA
========================================================= */

.chat-messages {

    position: absolute;

    top: 95px;

    bottom: 65px;

    left: 0;
    right: 0;

    padding:
        22px 15px;

    overflow-y: auto;

    scroll-behavior: smooth;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(255,220,230,.8),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 75%,
            rgba(167,34,73,.08),
            transparent 35%
        ),

        #fff8fa;
}


/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row {

    width: 100%;

    display: flex;

    margin-bottom: 12px;

    opacity: 0;

    transform:
        translateY(12px)
        scale(.96);

    animation:
        messageAppear
        .65s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


.message-row.ritesh {
    justify-content: flex-start;
}


.message-row.tisha {
    justify-content: flex-end;
}


.message-bubble {

    max-width: 78%;

    padding:
        10px 14px;

    border-radius: 19px;

    font-size: 15px;

    line-height: 1.38;

    box-shadow:
        0 3px 12px
        rgba(60,13,29,.08);
}


.message-row.ritesh
.message-bubble {

    background:
        white;

    color:
        #3d1422;

    border-bottom-left-radius:
        6px;
}


.message-row.tisha
.message-bubble {

    background:
        linear-gradient(
            135deg,
            #c9345c,
            #9e2045
        );

    color:
        white;

    border-bottom-right-radius:
        6px;

    box-shadow:
        0 5px 15px
        rgba(158,32,69,.22);
}


@keyframes messageAppear {

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

.typing-row {

    display: flex;

    width: 100%;

    margin-bottom: 12px;

    justify-content:
        flex-start;

    opacity: 0;

    transform:
        translateY(8px);

    animation:
        typingAppear
        .4s
        ease
        forwards;
}


.typing-row.tisha {

    justify-content:
        flex-end;
}


.typing-bubble {

    padding:
        10px 14px;

    border-radius: 19px;

    background:
        rgba(255,255,255,.95);

    box-shadow:
        0 3px 12px
        rgba(60,13,29,.08);

    color:
        #9d6474;

    font-size: 12px;

    font-style: italic;
}


.typing-row.tisha
.typing-bubble {

    background:
        #f1bdca;

    color:
        #72243c;
}


.typing-dots span {

    display: inline-block;

    animation:
        typingDots
        1.2s
        infinite;
}


.typing-dots span:nth-child(2) {
    animation-delay: .2s;
}

.typing-dots span:nth-child(3) {
    animation-delay: .4s;
}


@keyframes typingAppear {

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


@keyframes typingDots {

    0%,60%,100% {
        opacity: .3;
        transform:
            translateY(0);
    }

    30% {
        opacity: 1;
        transform:
            translateY(-2px);
    }
}


/* =========================================================
   CHAT BOTTOM
========================================================= */

.chat-bottom {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 65px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(255,250,252,.95);

    border-top:
        1px solid
        rgba(87,11,36,.08);

    z-index: 10;
}


.continue-button {

    opacity: 0;

    pointer-events: none;

    padding:
        10px 20px;

    border-radius: 30px;

    border:
        1px solid
        rgba(167,34,73,.25);

    background:
        rgba(167,34,73,.08);

    color:
        #8f2345;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    transition:
        opacity .8s ease,
        transform .3s ease;
}


.continue-button.visible {

    opacity: 1;

    pointer-events: auto;

    animation:
        continuePulse
        2s
        ease-in-out
        infinite;
}


@keyframes continuePulse {

    0%,100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.04);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px) {

    .dizzy-ring {

        width: 95vmin;
        height: 95vmin;
    }

    .notification-phone {

        width: 82vw;
    }

    .chat-phone {

        width: 100vw;
        height: 100vh;

        border-radius: 0;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     WAKE SCREEN
========================================================= -->

<section id="wakeScreen">

    <div class="ambient-light"></div>

    <div class="dizzy-ring"></div>

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <div
        class="blur-layer"
        id="blurLayer">
    </div>


    <div class="wake-content">

        <div class="eyebrow">

            Somewhere between midnight & forever

        </div>


        <div class="dialogue">

            <h1 id="dialogueText">

                Oh God... I'm still dizzy... 😵‍💫

            </h1>

        </div>


        <div
            class="tap-hint"
            id="tapHint">

            Tap anywhere to wake up

        </div>

    </div>

</section>


<!-- =========================================================
     FLASH
========================================================= -->

<div
    class="tap-flash"
    id="tapFlash">
</div>


<!-- =========================================================
     IPHONE NOTIFICATION
========================================================= -->

<section
    id="notificationScreen">

    <div
        class="notification-phone"
        id="notificationPhone">

        <div class="phone-screen">

            <div class="dynamic-island"></div>


            <div class="phone-time">

                12:37

            </div>


            <div class="notification">

                <div class="notification-top">

                    <div class="notification-name">

                        <div class="notification-icon">

                            R

                        </div>

                        Ritesh ❤️

                    </div>

                    <span>

                        now

                    </span>

                </div>


                <div class="notification-message">

                    Hi Babe! ❤️

                </div>


                <div class="notification-sub">

                    Messages

                </div>

            </div>


            <div class="notification-hint">

                Tap the message

            </div>

        </div>

    </div>

</section>


<!-- =========================================================
     CINEMATIC CHAT
========================================================= -->

<section
    id="chatScreen">

    <div class="chat-background"></div>


    <div class="chat-phone">


        <!-- HEADER -->

        <div class="chat-top">

            <div class="chat-avatar">

                R

            </div>


            <div>

                <div class="chat-name">

                    Ritesh ❤️

                </div>

                <div class="chat-status">

                    active now

                </div>

            </div>

        </div>


        <!-- MESSAGES -->

        <div
            class="chat-messages"
            id="chatMessages">
        </div>


        <!-- BOTTOM -->

        <div class="chat-bottom">

            <button
                class="continue-button"
                id="continueButton">

                Continue ❤️

            </button>

        </div>

    </div>

</section>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const wakeScreen =
    document.getElementById(
        "wakeScreen"
    );

const blurLayer =
    document.getElementById(
        "blurLayer"
    );

const dialogueText =
    document.getElementById(
        "dialogueText"
    );

const tapHint =
    document.getElementById(
        "tapHint"
    );

const tapFlash =
    document.getElementById(
        "tapFlash"
    );

const notificationScreen =
    document.getElementById(
        "notificationScreen"
    );

const chatScreen =
    document.getElementById(
        "chatScreen"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const continueButton =
    document.getElementById(
        "continueButton"
    );


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;


function getAudio() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return null;

        audioContext =
            new AudioContext();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    return audioContext;
}


/* =========================================================
   TAP SOUND
========================================================= */

function tapSound() {

    const ctx =
        getAudio();

    if (!ctx) return;


    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        "sine";


    osc.frequency.setValueAtTime(
        480,
        ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        680,
        ctx.currentTime + .08
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .05,
        ctx.currentTime + .02
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .25
    );


    osc.connect(gain);

    gain.connect(
        ctx.destination
    );


    osc.start();

    osc.stop(
        ctx.currentTime + .25
    );
}


/* =========================================================
   NOTIFICATION SOUND
========================================================= */

function notificationSound() {

    const ctx =
        getAudio();

    if (!ctx) return;


    const notes = [
        659,
        784,
        988
    ];


    notes.forEach(
        (frequency, index) => {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            const start =
                ctx.currentTime +
                index * .13;


            osc.type =
                "sine";

            osc.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                .0001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .08,
                start + .03
            );


            gain.gain.exponentialRampToValueAtTime(
                .0001,
                start + .45
            );


            osc.connect(gain);

            gain.connect(
                ctx.destination
            );


            osc.start(start);

            osc.stop(
                start + .45
            );

        }
    );
}


/* =========================================================
   WHOOSH
========================================================= */

function whoosh() {

    const ctx =
        getAudio();

    if (!ctx) return;


    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        "sine";


    osc.frequency.setValueAtTime(
        150,
        ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        55,
        ctx.currentTime + .8
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .08,
        ctx.currentTime + .12
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .8
    );


    osc.connect(gain);

    gain.connect(
        ctx.destination
    );


    osc.start();

    osc.stop(
        ctx.currentTime + .8
    );
}


/* =========================================================
   FLASH
========================================================= */

function flash() {

    tapFlash.classList.remove(
        "active"
    );

    void tapFlash.offsetWidth;

    tapFlash.classList.add(
        "active"
    );
}


/* =========================================================
   WAKE DIALOGUES
========================================================= */

const wakeDialogues = [

    "Oh God... I'm still dizzy... 😵‍💫",

    "Riteshhhhhhh... Babyyyy... ❤️",

    "Babyyyy!!! Where are you...? 🥺",

    "Ritesh... where are you hiding...? ❤️"

];


let tapCount = 0;


/* =========================================================
   SHOW DIALOGUE
========================================================= */

function showDialogue(text) {

    dialogueText.classList.remove(
        "show"
    );

    void dialogueText.offsetWidth;

    dialogueText.textContent =
        text;

    dialogueText.classList.add(
        "show"
    );
}


/* =========================================================
   INITIAL DIALOGUE
========================================================= */

setTimeout(() => {

    dialogueText.classList.add(
        "show"
    );

}, 500);


/* =========================================================
   WAKE SCREEN
========================================================= */

wakeScreen.addEventListener(
    "click",
    () => {

        tapCount++;

        tapSound();

        flash();


        if (tapCount === 1) {

            whoosh();

            showDialogue(
                wakeDialogues[1]
            );

            blurLayer.style.opacity =
                ".62";

            tapHint.textContent =
                "Tap again...";

        }


        else if (tapCount === 2) {

            showDialogue(
                wakeDialogues[2]
            );

            blurLayer.style.opacity =
                ".25";

            tapHint.textContent =
                "Almost awake...";

        }


        else if (tapCount === 3) {

            whoosh();

            showDialogue(
                wakeDialogues[3]
            );

            blurLayer.style.opacity =
                "0";

            tapHint.textContent =
                "You're awake... ❤️";


            document
                .querySelector(
                    ".dizzy-ring"
                )
                .style.animationDuration =
                "22s";


            setTimeout(() => {

                wakeScreen.style.opacity =
                    "0";

                wakeScreen.style.transform =
                    "scale(1.04)";

            }, 2400);


            setTimeout(() => {

                wakeScreen.style.display =
                    "none";

                notificationScreen.classList.add(
                    "active"
                );

                notificationSound();

            }, 3900);

        }

    }
);


/* =========================================================
   NOTIFICATION → CHAT
========================================================= */

notificationScreen.addEventListener(
    "click",
    () => {

        tapSound();

        whoosh();

        notificationScreen.classList.add(
            "zoom"
        );


        setTimeout(() => {

            notificationScreen.style.opacity =
                "0";

        }, 850);


        setTimeout(() => {

            notificationScreen.style.display =
                "none";

            chatScreen.classList.add(
                "active"
            );

            startConversation();

        }, 1350);

    }
);


/* =========================================================
   CONVERSATION DATA
========================================================= */

const conversation = [

    {
        sender: "ritesh",
        name: "Ritesh",
        text: "Hi Babe! ❤️"
    },

    {
        sender: "tisha",
        name: "Tisha",
        text: "Babyy where are you? 🥺❤️"
    },

    {
        sender: "ritesh",
        name: "Ritesh",
        text: "Don't worry, I'm close 😌❤️"
    },

    {
        sender: "tisha",
        name: "Tisha",
        text: "Baby come to me naaa 🥺👉👈"
    },

    {
        sender: "ritesh",
        name: "Ritesh",
        text: "Ahn ahn... first I need to see something 👀"
    },

    {
        sender: "tisha",
        name: "Tisha",
        text: "What? 👀"
    },

    {
        sender: "ritesh",
        name: "Ritesh",
        text: "Do you remember our moments? ❤️"
    },

    {
        sender: "tisha",
        name: "Tisha",
        text: "Haan Babuuuu... I remember 🥺❤️"
    },

    {
        sender: "ritesh",
        name: "Ritesh",
        text: "Let's see thennn... 😏❤️"
    }

];


/* =========================================================
   TYPING INDICATOR
========================================================= */

function showTyping(sender) {

    return new Promise(
        resolve => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "typing-row " +
                sender;


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "typing-bubble";


            bubble.innerHTML = `

                <span>
                    ${sender === "ritesh"
                        ? "Ritesh"
                        : "Tisha"}
                    is typing
                </span>

                <span class="typing-dots">

                    <span>.</span>
                    <span>.</span>
                    <span>.</span>

                </span>

            `;


            row.appendChild(
                bubble
            );


            chatMessages.appendChild(
                row
            );


            scrollChat();


            /*
                Exactly 2 seconds
                of typing indicator.
            */

            setTimeout(
                () => {

                    row.remove();

                    resolve();

                },
                2000
            );

        }
    );
}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    sender,
    text
) {

    return new Promise(
        resolve => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message-row " +
                sender;


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message-bubble";


            bubble.textContent =
                text;


            row.appendChild(
                bubble
            );


            chatMessages.appendChild(
                row
            );


            scrollChat();


            setTimeout(
                resolve,
                650
            );

        }
    );
}


/* =========================================================
   SCROLL
========================================================= */

function scrollChat() {

    setTimeout(() => {

        chatMessages.scrollTo({

            top:
                chatMessages.scrollHeight,

            behavior:
                "smooth"

        });

    }, 80);
}


/* =========================================================
   START CONVERSATION
========================================================= */

async function startConversation() {

    for (
        let i = 0;
        i < conversation.length;
        i++
    ) {

        const message =
            conversation[i];


        await showTyping(
            message.sender
        );


        await showMessage(
            message.sender,
            message.text
        );


        /*
            Tiny breathing pause
            between messages.
        */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    450
                )
        );

    }


    /*
        Conversation finished.
    */

    setTimeout(() => {

        continueButton.classList.add(
            "visible"
        );

    }, 700);
}


/* =========================================================
   CONTINUE → QUIZ.HTML
========================================================= */

continueButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        tapSound();

        chatScreen.style.opacity =
            "0";


        setTimeout(() => {

            window.location.href =
                "quiz.html";

        }, 900);

    }
);


/* =========================================================
   OPTIONAL: CLICK ANYWHERE AFTER
   FINAL MESSAGE
========================================================= */

chatScreen.addEventListener(
    "click",
    event => {

        if (
            continueButton.classList.contains(
                "visible"
            ) &&
            event.target !==
            continueButton
        ) {

            tapSound();

            chatScreen.style.opacity =
                "0";


            setTimeout(() => {

                window.location.href =
                    "quiz.html";

            }, 900);

        }

    }
);

</script>

</body>
</html>
