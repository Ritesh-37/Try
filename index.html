<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>For My Tishuuu ❤️</title>

    <style>

        /* =========================================================
           WINE & BLUSH PALETTE
        ========================================================= */

        :root {
            --deep: #190B12;
            --wine: #6D1F3B;
            --blush: #E9A0B5;
            --soft: #FFEFF4;

            --glass: rgba(255, 239, 244, 0.06);
            --glass-border: rgba(233, 160, 181, 0.22);
        }


        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        body {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            color: var(--soft);

            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(109, 31, 59, 0.42),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 15% 85%,
                    rgba(233, 160, 181, 0.09),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(109, 31, 59, 0.16),
                    transparent 30%
                ),
                var(--deep);
        }


        /* =========================================================
           WAKE SCREEN
        ========================================================= */

        #wakeScreen {

            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(109, 31, 59, 0.30),
                    transparent 45%
                ),
                var(--deep);
        }


        /* =========================================================
           CINEMATIC AMBIENT LIGHT
        ========================================================= */

        #wakeScreen::before {

            content: "";

            position: absolute;

            width: 75vw;
            height: 75vw;

            max-width: 800px;
            max-height: 800px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(109, 31, 59, 0.38),
                    transparent 68%
                );

            filter: blur(35px);

            animation:
                ambientPulse
                7s
                ease-in-out
                infinite
                alternate;

            pointer-events: none;
        }


        @keyframes ambientPulse {

            from {
                transform: scale(.85);
                opacity: .65;
            }

            to {
                transform: scale(1.12);
                opacity: 1;
            }
        }


        /* =========================================================
           VIGNETTE
        ========================================================= */

        #wakeScreen::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 35%,
                    rgba(0, 0, 0, .58) 100%
                );

            pointer-events: none;

            z-index: 2;
        }


        /* =========================================================
           FLOATING PARTICLES
        ========================================================= */

        .particles {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;
        }


        .particle {

            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: var(--blush);

            opacity: 0;

            box-shadow:
                0 0 10px rgba(233, 160, 181, .8);

            animation:
                floatParticle
                linear
                infinite;
        }


        .particle:nth-child(1) {
            left: 12%;
            bottom: -10%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .particle:nth-child(2) {
            left: 24%;
            bottom: -10%;
            animation-duration: 11s;
            animation-delay: 3s;
        }

        .particle:nth-child(3) {
            left: 43%;
            bottom: -10%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .particle:nth-child(4) {
            left: 62%;
            bottom: -10%;
            animation-duration: 12s;
            animation-delay: 4s;
        }

        .particle:nth-child(5) {
            left: 78%;
            bottom: -10%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        .particle:nth-child(6) {
            left: 90%;
            bottom: -10%;
            animation-duration: 13s;
            animation-delay: 5s;
        }


        @keyframes floatParticle {

            0% {
                transform:
                    translateY(0)
                    scale(.5);

                opacity: 0;
            }

            15% {
                opacity: .45;
            }

            70% {
                opacity: .25;
            }

            100% {
                transform:
                    translateY(-115vh)
                    translateX(30px)
                    scale(1.1);

                opacity: 0;
            }
        }


        /* =========================================================
           BLUR VEIL
        ========================================================= */

        .blur-layer {

            position: absolute;

            inset: 0;

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(109, 31, 59, .15),
                    rgba(25, 11, 18, .94)
                );

            transition:
                backdrop-filter 1.2s ease,
                -webkit-backdrop-filter 1.2s ease,
                background 1.2s ease,
                opacity 1.6s ease;

            z-index: 4;

            pointer-events: none;
        }


        /* =========================================================
           WAKE CONTENT
        ========================================================= */

        .wake-content {

            position: relative;

            z-index: 5;

            width: min(90%, 650px);

            padding: 30px;
        }


        /* =========================================================
           SMALL INTRO
        ========================================================= */

        .wake-eyebrow {

            color: var(--blush);

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;

            margin-bottom: 20px;

            opacity: .75;
        }


        /* =========================================================
           MAIN TEXT
        ========================================================= */

        .wake-content h1 {

            font-size:
                clamp(
                    34px,
                    8vw,
                    62px
                );

            font-weight: 500;

            line-height: 1.1;

            color: var(--soft);

            margin-bottom: 18px;

            text-shadow:
                0 0 25px rgba(233, 160, 181, .18);
        }


        .wake-content p {

            color: var(--blush);

            font-size:
                clamp(
                    14px,
                    3.5vw,
                    17px
                );

            line-height: 1.7;

            letter-spacing: .7px;

            opacity: .85;
        }


        /* =========================================================
           WAKE BUTTON
        ========================================================= */

        .wake-button {

            margin-top: 36px;

            padding:
                15px
                30px;

            border-radius: 50px;

            border:
                1px solid
                rgba(233, 160, 181, .32);

            background:
                linear-gradient(
                    135deg,
                    rgba(109, 31, 59, .72),
                    rgba(25, 11, 18, .92)
                );

            color: var(--soft);

            font-size: 14px;

            letter-spacing: 1px;

            cursor: pointer;

            box-shadow:
                0 0 25px
                rgba(109, 31, 59, .35),

                inset 0 0 15px
                rgba(233, 160, 181, .04);

            transition:
                transform .3s ease,
                box-shadow .3s ease,
                border-color .3s ease;
        }


        .wake-button:hover {

            transform:
                translateY(-3px);

            border-color:
                rgba(233, 160, 181, .65);

            box-shadow:
                0 0 35px
                rgba(233, 160, 181, .20),

                0 12px 35px
                rgba(0, 0, 0, .35);
        }


        .wake-button:active {

            transform:
                scale(.95);
        }


        /* =========================================================
           TAP COUNTER
        ========================================================= */

        .wake-count {

            margin-top: 18px;

            color:
                rgba(
                    233,
                    160,
                    181,
                    .65
                );

            font-size: 12px;

            letter-spacing: 1.5px;

            transition:
                opacity .4s ease;
        }


        /* =========================================================
           POPUP
        ========================================================= */

        .popup {

            position: fixed;

            left: 50%;

            bottom: 30px;

            transform:
                translateX(-50%)
                translateY(25px);

            width:
                min(
                    90%,
                    430px
                );

            padding:
                14px
                20px;

            border-radius: 18px;

            background:
                rgba(
                    25,
                    11,
                    18,
                    .94
                );

            border:
                1px solid
                rgba(
                    233,
                    160,
                    181,
                    .22
                );

            color: var(--soft);

            text-align: center;

            font-size: 13px;

            line-height: 1.5;

            box-shadow:
                0 15px 45px
                rgba(0, 0, 0, .45);

            opacity: 0;

            pointer-events: none;

            z-index: 20;

            transition:
                opacity .4s ease,
                transform .4s ease;
        }


        .popup.show {

            opacity: 1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media(max-width: 500px) {

            .wake-content {
                padding: 20px;
            }

            .wake-eyebrow {
                letter-spacing: 3px;
            }

            .wake-button {
                padding:
                    14px
                    25px;
            }

            .popup {
                bottom: 20px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         WAKE-UP SCREEN
    ========================================================== -->

    <section
        class="screen"
        id="wakeScreen"
    >

        <!-- Cinematic particles -->

        <div
            class="particles"
            aria-hidden="true"
        >

            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>

        </div>


        <!-- Blur covering the room -->

        <div
            class="blur-layer"
            id="blurLayer"
        ></div>


        <!-- Main wake-up content -->

        <div class="wake-content">

            <div class="wake-eyebrow">
                Somewhere between midnight & forever
            </div>

            <h1>
                Oh God... 😵‍💫
            </h1>

            <p>
                Someone seems to have had<br>
                a little too much fun...
            </p>


            <button
                class="wake-button"
                id="wakeBtn"
                type="button"
            >
                Tap to wake up
            </button>


            <div
                class="wake-count"
                id="wakeCount"
            >
                5 taps remaining
            </div>

        </div>

    </section>


    <!-- =========================================================
         POPUP
    ========================================================== -->

    <div
        class="popup"
        id="popup"
    ></div>


    <script>

        /* =========================================================
           WAKE-UP JAVASCRIPT
        ========================================================= */

        const wakeBtn =
            document.getElementById("wakeBtn");

        const blurLayer =
            document.getElementById("blurLayer");

        const wakeCount =
            document.getElementById("wakeCount");

        const popupElement =
            document.getElementById("popup");


        let wakeTaps = 0;


        /* =========================================================
           POPUP
        ========================================================= */

        function popup(
            message,
            duration = 2400
        ) {

            popupElement.textContent =
                message;

            popupElement.classList.add("show");


            setTimeout(() => {

                popupElement.classList.remove("show");

            }, duration);
        }


        /* =========================================================
           SIMPLE CLICK SOUND
        ========================================================= */

        function sound() {

            try {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;

                const ctx =
                    new AudioContext();

                const osc =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();


                osc.connect(gain);

                gain.connect(
                    ctx.destination
                );


                osc.frequency.value = 420;

                gain.gain.value = .045;


                osc.start();


                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    ctx.currentTime + .18
                );


                osc.stop(
                    ctx.currentTime + .18
                );

            } catch (e) {

                /* Audio isn't essential */

            }
        }


        /* =========================================================
           WAKE-UP INTERACTION
        ========================================================= */

        wakeBtn.addEventListener(
            "click",
            () => {

                wakeTaps++;

                sound();


                const remaining =
                    5 - wakeTaps;


                if (remaining > 0) {

                    wakeCount.textContent =
                        remaining +
                        (
                            remaining === 1
                                ? " tap"
                                : " taps"
                        ) +
                        " remaining";


                    /* Gradually reveal */

                    const blurAmount =
                        Math.max(
                            0,
                            25 -
                            wakeTaps * 5
                        );


                    const darkness =
                        Math.max(
                            .12,
                            .94 -
                            wakeTaps * .16
                        );


                    blurLayer.style.backdropFilter =
                        `blur(${blurAmount}px)`;

                    blurLayer.style.webkitBackdropFilter =
                        `blur(${blurAmount}px)`;


                    blurLayer.style.background =
                        `rgba(25, 11, 18, ${darkness})`;


                    const messages = [

                        "Ugh... my head... 😵‍💫",

                        "Okay... I can see a little...",

                        "Riteshhh... where are you? ❤️",

                        "Almost awake..."

                    ];


                    popup(
                        messages[wakeTaps - 1]
                    );

                }

                else {

                    /* Completely awake */

                    blurLayer.style.opacity =
                        "0";


                    wakeBtn.textContent =
                        "I'm awake... ❤️";


                    wakeCount.textContent =
                        "";


                    popup(
                        "There you are, Tishuuu... ❤️",
                        3000
                    );


                    /*
                       TEMPORARY END OF STEP 1

                       Later this will transition
                       into the iPhone scene.
                    */

                }

            }
        );

    </script>

</body>

</html>
