<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>12:37 AM ❤️</title>

<style>

/* =========================================================
   PAGE 4
   WAKE UP → IPHONE → CINEMATIC CHAT
========================================================= */

:root {
    --deepest-red: #260611;
    --deep-red: #3b0718;
    --wine: #570b24;
    --rich-red: #790f31;
    --romantic-red: #a72249;
    --rose: #d94f70;

    --soft-pink: #f3a6ba;
    --cream: #fff3f6;
    --white: #fffafd;

    --text: #3c0d1d;
    --muted: #a66a7c;

    --gold: #c9a96e;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background: #260611;

    color: var(--cream);

    cursor: pointer;
}


/* =========================================================
   WAKE SCREEN
========================================================= */

#wakeScreen {

    position: fixed;
    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(167,34,73,.42),
            transparent 34%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(121,15,49,.75),
            transparent 38%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(167,34,73,.38),
            transparent 34%
        ),

        linear-gradient(
            135deg,
            #260611 0%,
            #570b24 42%,
            #3b0718 72%,
            #19040b 100%
        );

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    z-index: 10;
}


#wakeScreen::before {

    content: "";

    position: absolute;
    inset: 0;

    background:

        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(30,2,10,.35) 75%,
            rgba(15,1,5,.75) 100%
        );

    pointer-events: none;

    z-index: 20;
}


#wakeScreen::after {

    content: "";

    position: absolute;
    inset: 0;

    background:

        radial-gradient(
            circle at 30% 30%,
            rgba(217,79,112,.12),
            transparent 28%
        ),

        radial-gradient(
            circle at 75% 70%,
            rgba(121,15,49,.25),
            transparent 35%
        );

    animation:
        redBreathing
        7s
        ease-in-out
        infinite alternate;

    pointer-events: none;

    z-index: 2;
}


@keyframes redBreathing {

    from {
        opacity: .55;
        transform: scale(.95);
    }

    to {
        opacity: 1;
        transform: scale(1.08);
    }
}


/* =========================================================
   AMBIENT GLOW
========================================================= */

.ambient-light {

    position: absolute;

    width: 80vw;
    height: 80vw;

    max-width: 900px;
    max-height: 900px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(217,79,112,.25),
            rgba(121,15,49,.18),
            transparent 70%
        );

    filter: blur(45px);

    animation:
        ambientBreath
        6s
        ease-in-out
        infinite alternate;

    pointer-events: none;

    z-index: 1;
}


@keyframes ambientBreath {

    from {
        transform: scale(.8);
        opacity: .55;
    }

    to {
        transform: scale(1.15);
        opacity: 1;
    }
}


/* =========================================================
   DIZZY RINGS
========================================================= */

.dizzy-ring {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 75vmin;
    height: 75vmin;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(217,79,112,.28);

    animation:
        spin
        10s
        linear
        infinite;

    opacity: .7;

    z-index: 3;

    pointer-events: none;
}


.dizzy-ring::before {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 50%;

    border:
        1px solid
        rgba(167,34,73,.38);

    animation:
        reverseSpin
        7s
        linear
        infinite;
}


.dizzy-ring::after {

    content: "";

    position: absolute;

    inset: 20%;

    border-radius: 50%;

    border:
        1px dashed
        rgba(243,166,186,.18);

    animation:
        spin
        5s
        linear
        infinite;
}


@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes reverseSpin {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* =========================================================
   FLOATING PARTICLES
========================================================= */

.particles {

    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 5;
}


.particle {

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: var(--rose);

    box-shadow:
        0 0 15px
        rgba(217,79,112,.7);

    opacity: 0;

    animation:
        floatUp
        linear
        infinite;
}


.particle:nth-child(1) {
    left: 8%;
    bottom: -5%;
    animation-duration: 11s;
}

.particle:nth-child(2) {
    left: 25%;
    bottom: -5%;
    animation-duration: 13s;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    left: 47%;
    bottom: -5%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.particle:nth-child(4) {
    left: 70%;
    bottom: -5%;
    animation-duration: 12s;
    animation-delay: 3s;
}

.particle:nth-child(5) {
    left: 90%;
    bottom: -5%;
    animation-duration: 10s;
    animation-delay: 1s;
}


@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            scale(.3);

        opacity: 0;
    }

    20% {
        opacity: .6;
    }

    70% {
        opacity: .25;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(35px)
            scale(1);

        opacity: 0;
    }
}


/* =========================================================
   BLUR LAYER
========================================================= */

.blur-layer {

    position: absolute;

    inset: -20px;

    background:

        radial-gradient(
            circle at center,
            rgba(80,8,30,.55),
            rgba(38,6,17,.94)
        );

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    opacity: 1;

    transition:
        opacity 2.3s ease,
        backdrop-filter 2s ease;

    z-index: 10;

    pointer-events: none;
}


/* =========================================================
   WAKE CONTENT
========================================================= */

.wake-content {

    position: relative;

    z-index: 25;

    width:
        min(90%, 700px);

    padding: 30px;
}


.eyebrow {

    color:
        var(--soft-pink);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 22px;

    opacity: .65;
}


.dialogue {

    min-height: 120px;

    display: flex;

    align-items: center;
    justify-content: center;
}


.dialogue h1 {

    color:
        var(--cream);

    font-size:
        clamp(
            30px,
            7vw,
            58px
        );

    font-weight: 500;

    line-height: 1.18;

    text-shadow:
        0 5px 30px
        rgba(0,0,0,.35);

    opacity: 0;

    filter: blur(8px);

    transform:
        translateY(20px)
        scale(.97);
}


.dialogue h1.show {

    animation:
        slowAppear
        1.8s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes slowAppear {

    0% {
        opacity: 0;
        filter: blur(10px);
        transform:
            translateY(20px)
            scale(.97);
    }

    55% {
        opacity: .7;
        filter: blur(3px);
    }

    100% {
        opacity: 1;
        filter: blur(0);
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TAP HINT
========================================================= */

.tap-hint {

    margin-top: 32px;

    color:
        #e9a7b9;

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: .45;

    animation:
        hintPulse
        2.4s
        ease-in-out
        infinite;
}


@keyframes hintPulse {

    0%,100% {
        opacity: .25;
    }

    50% {
        opacity: .75;
    }
}


/* =========================================================
   FLASH
========================================================= */

.tap-flash {

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at center,
            rgba(255,255,255,.65),
            rgba(217,79,112,.16),
            transparent 65%
        );

    opacity: 0;

    pointer-events: none;

    z-index: 1000;
}


.tap-flash.active {

    animation:
        flash
        .6s
        ease;
}


@keyframes flash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   NOTIFICATION SCREEN
========================================================= */

#notificationScreen {

    position: fixed;
    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:

        radial-gradient(
            circle at 50% 30%,
            rgba(167,34,73,.55),
            transparent 32%
        ),

        radial-gradient(
            circle at 15% 85%,
            rgba(87,11,36,.8),
            transparent 40%
        ),

        linear-gradient(
            135deg,
            #260611,
            #570b24 45%,
            #3b0718
        );

    opacity: 0;

    visibility: hidden;

    transform: scale(1.05);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;

    z-index: 200;
}


#notificationScreen.active {

    opacity: 1;

    visibility: visible;

    transform: scale(1);
}


/* =========================================================
   IPHONE FRAME
   SAME FRAME USED FOR NOTIFICATION + CHAT
========================================================= */

.notification-phone,
.chat-phone {

    width:
        min(330px, 82vw);

    aspect-ratio:
        9 / 19.5;

    padding: 10px;

    border-radius: 42px;

    background:
        linear-gradient(
            145deg,
            #3a3a3a 0%,
            #171717 28%,
            #050505 55%,
            #242424 82%,
            #080808 100%
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:

        0 45px 100px
        rgba(0,0,0,.65),

        0 15px 40px
        rgba(217,79,112,.2),

        inset 0 0 0 1px
        rgba(255,255,255,.06);

    position: relative;
}


/* =========================================================
   SIDE BUTTON DETAILS
========================================================= */

.notification-phone::before,
.chat-phone::before {

    content: "";

    position: absolute;

    left: -3px;

    top: 105px;

    width: 3px;

    height: 70px;

    border-radius: 3px 0 0 3px;

    background:
        linear-gradient(
            to bottom,
            #444,
            #111,
            #444
        );

    box-shadow:
        0 90px 0 #222,
        0 112px 0 #222;
}


.notification-phone::after,
.chat-phone::after {

    content: "";

    position: absolute;

    right: -3px;

    top: 135px;

    width: 3px;

    height: 95px;

    border-radius: 0 3px 3px 0;

    background:
        linear-gradient(
            to bottom,
            #444,
            #111,
            #444
        );
}


/* =========================================================
   NOTIFICATION PHONE ANIMATION
========================================================= */

.notification-phone {

    transform:
        translateY(35px)
        scale(.92);

    opacity: 0;

    transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.2,.8,.2,1);

    cursor: pointer;
}


#notificationScreen.active
.notification-phone {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   PHONE SCREEN
========================================================= */

.phone-screen {

    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    border-radius: 34px;

    background:

        radial-gradient(
            circle at 50% 25%,
            rgba(167,34,73,.5),
            transparent 30%
        ),

        linear-gradient(
            145deg,
            #5d0c28,
            #210610 70%,
            #100308
        );

    color: white;
}


/* =========================================================
   DYNAMIC ISLAND
========================================================= */

.dynamic-island {

    position: absolute;

    top: 11px;

    left: 50%;

    transform:
        translateX(-50%);

    width: 92px;
    height: 27px;

    border-radius: 30px;

    background:
        #030303;

    z-index: 10;
}


/* =========================================================
   TIME
========================================================= */

.phone-time {

    position: absolute;

    top: 53px;

    left: 50%;

    transform:
        translateX(-50%);

    font-size: 14px;

    letter-spacing: 1px;

    opacity: .78;
}


/* =========================================================
   NOTIFICATION
========================================================= */

.notification {

    position: absolute;

    left: 13px;
    right: 13px;

    top: 112px;

    padding: 18px;

    border-radius: 24px;

    background:
        rgba(255,255,255,.13);

    border:
        1px solid
        rgba(255,255,255,.16);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.3);

    text-align: left;

    animation:
        notificationFloat
        3s
        ease-in-out
        infinite;
}


@keyframes notificationFloat {

    0%,100% {
        transform:
            translateY(0);
    }

    50% {
        transform:
            translateY(-4px);
    }
}


.notification-top {

    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 11px;

    font-size: 11px;

    opacity: .7;
}


.notification-name {

    display: flex;

    align-items: center;

    gap: 8px;

    font-size: 13px;

    font-weight: bold;
}


.notification-icon {

    width: 30px;
    height: 30px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #d94f70,
            #6d0e2c
        );

    box-shadow:
        0 5px 15px
        rgba(217,79,112,.45);
}


.notification-message {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 18px;

    font-weight: 500;
}


.notification-sub {

    margin-top: 6px;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    font-size: 12px;

    opacity: .55;
}


.notification-hint {

    position: absolute;

    bottom: 35px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 9px;

    letter-spacing: 3px;

    text-transform: uppercase;

    opacity: .5;

    animation:
        hintPulse
        2s
        ease-in-out
        infinite;
}


/* =========================================================
   PHONE ZOOM
========================================================= */

#notificationScreen.zoom {

    background:
        #050105;

    transition:
        background 1s ease;
}


#notificationScreen.zoom
.notification-phone {

    animation:
        phoneZoom
        1.35s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes phoneZoom {

    0% {
        transform:
            scale(1);
    }

    100% {
        transform:
            scale(4.5);
    }
}


/* =========================================================
   CHAT SCREEN
========================================================= */

#chatScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        #260611;

    opacity: 0;

    visibility: hidden;

    z-index: 500;

    transition:
        opacity 1s ease;
}


#chatScreen.active {

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   CINEMATIC CHAT BACKGROUND
========================================================= */

.chat-background {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            circle at 50% 30%,
            rgba(167,34,73,.42),
            transparent 35%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(87,11,36,.7),
            transparent 40%
        ),

        radial-gradient(
            circle at 85% 70%,
            rgba(217,79,112,.14),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #260611,
            #570b24,
            #3b0718
        );

    animation:
        cinematicBackground
        12s
        ease-in-out
        infinite alternate;
}


@keyframes cinematicBackground {

    from {
        transform: scale(1);
        filter: saturate(.9);
    }

    to {
        transform: scale(1.08);
        filter: saturate(1.15);
    }
}


/* =========================================================
   CHAT PHONE
   NOW IDENTICAL TO THE IPHONE FRAME
========================================================= */

.chat-phone {

    z-index: 5;

    height:
        min(850px, 94vh);

    width:
        min(420px, 94vw);

    /*
       This is the important part:
       dark iPhone body + 10px border + rounded screen
    */

    padding: 10px;

    border-radius: 42px;

    background:
        linear-gradient(
            145deg,
            #3a3a3a 0%,
            #171717 28%,
            #050505 55%,
            #242424 82%,
            #080808 100%
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    box-shadow:

        0 45px 110px
        rgba(0,0,0,.7),

        0 15px 45px
        rgba(217,79,112,.22),

        inset 0 0 0 1px
        rgba(255,255,255,.06);

    transform:
        scale(.94);

    opacity: 0;

    animation:
        chatReveal
        1.15s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes chatReveal {

    from {
        opacity: 0;
        transform:
            scale(.88)
            translateY(25px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}


/* =========================================================
   CHAT INNER SCREEN
========================================================= */

.chat-phone::after {

    z-index: 20;
}


/* =========================================================
   CHAT TOP
========================================================= */

.chat-top {

    height: 72px;

    padding:
        28px 18px 8px;

    display: flex;

    align-items: center;

    gap: 12px;

    background:
        rgba(255,250,252,.96);

    border-bottom:
        1px solid
        rgba(87,11,36,.1);

    position: relative;

    z-index: 10;
}


.chat-avatar {

    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            135deg,
            #d94f70,
            #720e2d
        );

    color: white;

    font-family:
        Georgia,
        serif;

    box-shadow:
        0 5px 18px
        rgba(217,79,112,.28);
}


.chat-name {

    color:
        #360c1b;

    font-weight: 600;

    font-size: 15px;
}


.chat-status {

    color:
        #a46777;

    font-size: 10px;

    margin-top: 2px;
}


/* =========================================================
   CHAT MESSAGES
========================================================= */

.chat-messages {

    position: absolute;

    top: 72px;

    bottom: 58px;

    left: 10px;
    right: 10px;

    padding:
        18px 12px;

    overflow-y: auto;

    scroll-behavior: smooth;

    background:

        radial-gradient(
            circle at 15% 15%,
            rgba(255,220,230,.8),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 75%,
            rgba(167,34,73,.08),
            transparent 35%
        ),

        #fff8fa;
}


.chat-messages::-webkit-scrollbar {
    width: 3px;
}

.chat-messages::-webkit-scrollbar-thumb {
    background: rgba(167,34,73,.25);
    border-radius: 10px;
}


/* =========================================================
   MESSAGE ROW
========================================================= */

.message-row {

    width: 100%;

    display: flex;

    margin-bottom: 12px;

    opacity: 0;

    transform:
        translateY(12px)
        scale(.96);

    animation:
        messageAppear
        .65s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


.message-row.ritesh {
    justify-content: flex-start;
}


.message-row.tisha {
    justify-content: flex-end;
}


.message-bubble {

    max-width: 78%;

    padding:
        10px 14px;

    border-radius: 19px;

    font-size: 15px;

    line-height: 1.38;

    box-shadow:
        0 3px 12px
        rgba(60,13,29,.08);
}


.message-row.ritesh
.message-bubble {

    background:
        white;

    color:
        #3d1422;

    border-bottom-left-radius:
        6px;
}


.message-row.tisha
.message-bubble {

    background:
        linear-gradient(
            135deg,
            #c9345c,
            #9e2045
        );

    color:
        white;

    border-bottom-right-radius:
        6px;

    box-shadow:
        0 5px 15px
        rgba(158,32,69,.22);
}


@keyframes messageAppear {

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TYPING INDICATOR
========================================================= */

.typing-row {

    display: flex;

    width: 100%;

    margin-bottom: 12px;

    justify-content:
        flex-start;

    opacity: 0;

    transform:
        translateY(8px);

    animation:
        typingAppear
        .4s
        ease
        forwards;
}


.typing-row.tisha {

    justify-content:
        flex-end;
}


.typing-bubble {

    padding:
        10px 14px;

    border-radius: 19px;

    background:
        rgba(255,255,255,.95);

    box-shadow:
        0 3px 12px
        rgba(60,13,29,.08);

    color:
        #9d6474;

    font-size: 12px;

    font-style: italic;
}


.typing-row.tisha
.typing-bubble {

    background:
        #f1bdca;

    color:
        #72243c;
}


.typing-dots span {

    display: inline-block;

    animation:
        typingDots

}

}

}

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const wakeScreen =
    document.getElementById(
        "wakeScreen"
    );

const blurLayer =
    document.getElementById(
        "blurLayer"
    );

const dialogueText =
    document.getElementById(
        "dialogueText"
    );

const tapHint =
    document.getElementById(
        "tapHint"
    );

const tapFlash =
    document.getElementById(
        "tapFlash"
    );

const notificationScreen =
    document.getElementById(
        "notificationScreen"
    );

const notificationPhone =
    document.getElementById(
        "notificationPhone"
    );

const chatScreen =
    document.getElementById(
        "chatScreen"
    );

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const continueButton =
    document.getElementById(
        "continueButton"
    );


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;

let masterGain = null;

let musicGain = null;

let musicStarted = false;

let musicTimer = null;

let musicStep = 0;


/* =========================================================
   GET AUDIO CONTEXT
========================================================= */

function getAudio() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) return null;

        audioContext =
            new AudioContext();

        masterGain =
            audioContext.createGain();

        musicGain =
            audioContext.createGain();

        masterGain.gain.value =
            0.85;

        musicGain.gain.value =
            0.0001;

        musicGain.connect(
            masterGain
        );

        masterGain.connect(
            audioContext.destination
        );
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }

    return audioContext;
}


/* =========================================================
   GENERIC TONE
========================================================= */

function playTone(
    frequency,
    duration,
    volume,
    type = "sine",
    destination = null
) {

    const ctx =
        getAudio();

    if (!ctx) return;


    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        type;

    osc.frequency.setValueAtTime(
        frequency,
        ctx.currentTime
    );


    gain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        volume,
        ctx.currentTime + 0.03
    );


    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        ctx.currentTime + duration
    );


    osc.connect(gain);

    gain.connect(
        destination ||
        masterGain
    );


    osc.start();

    osc.stop(
        ctx.currentTime +
        duration +
        .05
    );
}


/* =========================================================
   TAP SOUND
========================================================= */

function tapSound() {

    playTone(
        480,
        .25,
        .05,
        "sine"
    );

    setTimeout(() => {

        playTone(
            680,
            .22,
            .035,
            "sine"
        );

    }, 55);
}


/* =========================================================
   NOTIFICATION SOUND
========================================================= */

function notificationSound() {

    const notes = [
        659,
        784,
        988
    ];


    notes.forEach(
        (frequency, index) => {

            setTimeout(() => {

                playTone(
                    frequency,
                    .45,
                    .08,
                    "sine"
                );

            }, index * 130);

        }
    );
}


/* =========================================================
   WHOOSH
========================================================= */

function whoosh() {

    const ctx =
        getAudio();

    if (!ctx) return;


    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    osc.type =
        "sine";


    osc.frequency.setValueAtTime(
        150,
        ctx.currentTime
    );


    osc.frequency.exponentialRampToValueAtTime(
        55,
        ctx.currentTime + .8
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .08,
        ctx.currentTime + .12
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .8
    );


    osc.connect(gain);

    gain.connect(
        masterGain
    );


    osc.start();

    osc.stop(
        ctx.currentTime + .8
    );
}


/* =========================================================
   ROMANTIC CINEMATIC BGM
=========================================================

   Soft piano-like ambient music.

   No external MP3.
   Works through Web Audio API.

========================================================= */

const musicChords = [

    [261.63, 329.63, 392.00],

    [220.00, 261.63, 329.63],

    [174.61, 220.00, 261.63],

    [196.00, 246.94, 293.66]

];


const melody = [

    523.25,
    493.88,
    440.00,
    392.00,

    440.00,
    493.88,
    523.25,
    659.25,

    587.33,
    523.25,
    493.88,
    440.00,

    392.00,
    440.00,
    493.88,
    523.25

];


/* =========================================================
   PLAY MUSIC CHORD
========================================================= */

function playMusicChord() {

    const ctx =
        getAudio();

    if (!ctx) return;


    const chord =
        musicChords[
            musicStep %
            musicChords.length
        ];


    chord.forEach(
        (frequency, index) => {

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            osc.type =
                "sine";


            osc.frequency.value =
                frequency;


            const start =
                ctx.currentTime;


            gain.gain.setValueAtTime(
                0.0001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                0.018,
                start + .7
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                start + 3.8
            );


            osc.connect(gain);

            gain.connect(
                musicGain
            );


            osc.start(start);

            osc.stop(
                start + 4
            );

        }
    );


    /* Soft high piano note */

    const melodyNote =
        melody[
            musicStep %
            melody.length
        ];


    setTimeout(() => {

        playTone(
            melodyNote,
            2.2,
            .018,
            "triangle",
            musicGain
        );

    }, 550);


    musicStep++;


    musicTimer =
        setTimeout(
            playMusicChord,
            3600
        );
}


/* =========================================================
   START ROMANTIC BGM
========================================================= */

function startRomanticBGM() {

    const ctx =
        getAudio();

    if (!ctx) return;

    if (musicStarted) return;

    musicStarted = true;


    /*
       Very gentle volume.
       The music should feel like
       something happening behind
       the conversation.
    */

    musicGain.gain.cancelScheduledValues(
        ctx.currentTime
    );


    musicGain.gain.setValueAtTime(
        0.0001,
        ctx.currentTime
    );


    musicGain.gain.exponentialRampToValueAtTime(
        0.16,
        ctx.currentTime + 4
    );


    musicStep = 0;

    playMusicChord();
}


/* =========================================================
   FADE OUT MUSIC
========================================================= */

function stopRomanticBGM() {

    const ctx =
        getAudio();

    if (!ctx || !musicGain) return;


    clearTimeout(
        musicTimer
    );


    musicGain.gain.cancelScheduledValues(
        ctx.currentTime
    );


    musicGain.gain.setValueAtTime(
        Math.max(
            musicGain.gain.value,
            .0001
        ),
        ctx.currentTime
    );


    musicGain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + 1.4
    );


    setTimeout(() => {

        musicStarted = false;

    }, 1500);
}


/* =========================================================
   FLASH
========================================================= */

function flash() {

    tapFlash.classList.remove(
        "active"
    );

    void tapFlash.offsetWidth;

    tapFlash.classList.add(
        "active"
    );
}


/* =========================================================
   WAKE DIALOGUES
========================================================= */

const wakeDialogues = [

    "Oh God... I'm still dizzy... 😵‍💫",

    "Riteshhhhhhh... Babyyyy... ❤️",

    "Babyyyy!!! Where are you...? 🥺",

    "Ritesh... where are you hiding...? ❤️"

];


let tapCount = 0;


/* =========================================================
   SHOW DIALOGUE
========================================================= */

function showDialogue(text) {

    dialogueText.classList.remove(
        "show"
    );

    void dialogueText.offsetWidth;

    dialogueText.textContent =
        text;

    dialogueText.classList.add(
        "show"
    );
}


/* =========================================================
   INITIAL DIALOGUE
========================================================= */

setTimeout(() => {

    dialogueText.classList.add(
        "show"
    );

}, 500);


/* =========================================================
   WAKE SCREEN
========================================================= */

wakeScreen.addEventListener(
    "click",
    () => {

        tapCount++;

        tapSound();

        flash();


        if (tapCount === 1) {

            whoosh();

            showDialogue(
                wakeDialogues[1]
            );

            blurLayer.style.opacity =
                ".62";

            tapHint.textContent =
                "Tap again...";

        }


        else if (tapCount === 2) {

            showDialogue(
                wakeDialogues[2]
            );

            blurLayer.style.opacity =
                ".25";

            tapHint.textContent =
                "Almost awake...";

        }


        else if (tapCount === 3) {

            whoosh();

            showDialogue(
                wakeDialogues[3]
            );

            blurLayer.style.opacity =
                "0";

            tapHint.textContent =
                "You're awake... ❤️";


            document
                .querySelector(
                    ".dizzy-ring"
                )
                .style.animationDuration =
                "22s";


            setTimeout(() => {

                wakeScreen.style.opacity =
                    "0";

                wakeScreen.style.transform =
                    "scale(1.04)";

            }, 2400);


            setTimeout(() => {

                wakeScreen.style.display =
                    "none";

                notificationScreen.classList.add(
                    "active"
                );

                notificationSound();

            }, 3900);

        }

    }
);


/* =========================================================
   NOTIFICATION → CHAT
========================================================= */

notificationScreen.addEventListener(
    "click",
    () => {

        tapSound();

        whoosh();


        notificationScreen.classList.add(
            "zoom"
        );


        setTimeout(() => {

            notificationScreen.style.opacity =
                "0";

        }, 850);


        setTimeout(() => {

            notificationScreen.style.display =
                "none";

            chatScreen.classList.add(
                "active"
            );


            /*
               Start the romantic music
               exactly when the chat appears.
            */

            startRomanticBGM();


            startConversation();

        }, 1350);

    }
);


/* =========================================================
   CONVERSATION
========================================================= */

const conversation = [

    {
        sender: "ritesh",
        text: "Hi Babe! ❤️"
    },

    {
        sender: "tisha",
        text: "Babyy where are you? 🥺❤️"
    },

    {
        sender: "ritesh",
        text: "Don't worry, I'm close 😌❤️"
    },

    {
        sender: "tisha",
        text: "Baby come to me naaa 🥺👉👈"
    },

    {
        sender: "ritesh",
        text: "Ahn ahn... first I need to see something 👀"
    },

    {
        sender: "tisha",
        text: "What? 👀"
    },

    {
        sender: "ritesh",
        text: "Do you remember our moments? ❤️"
    },

    {
        sender: "tisha",
        text: "Haan Babuuuu... I remember 🥺❤️"
    },

    {
        sender: "ritesh",
        text: "Let's see thennn... 😏❤️"
    }

];


/* =========================================================
   SHOW TYPING
========================================================= */

function showTyping(sender) {

    return new Promise(
        resolve => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "typing-row " +
                sender;


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "typing-bubble";


            bubble.innerHTML = `

                <span>
                    ${sender === "ritesh"
                        ? "Ritesh"
                        : "Tisha"}
                    is typing
                </span>

                <span class="typing-dots">

                    <span>.</span>
                    <span>.</span>
                    <span>.</span>

                </span>

            `;


            row.appendChild(
                bubble
            );


            chatMessages.appendChild(
                row
            );


            scrollChat();


            /*
               EXACTLY 2 SECONDS
            */

            setTimeout(
                () => {

                    row.remove();

                    resolve();

                },
                2000
            );

        }
    );
}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(
    sender,
    text
) {

    return new Promise(
        resolve => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message-row " +
                sender;


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message-bubble";


            bubble.textContent =
                text;


            row.appendChild(
                bubble
            );


            chatMessages.appendChild(
                row
            );


            scrollChat();


            setTimeout(
                resolve,
                650
            );

        }
    );
}


/* =========================================================
   SCROLL CHAT
========================================================= */

function scrollChat() {

    setTimeout(() => {

        chatMessages.scrollTo({

            top:
                chatMessages.scrollHeight,

            behavior:
                "smooth"

        });

    }, 80);
}


/* =========================================================
   START CONVERSATION
========================================================= */

async function startConversation() {

    for (
        let i = 0;
        i < conversation.length;
        i++
    ) {

        const message =
            conversation[i];


        await showTyping(
            message.sender
        );


        await showMessage(
            message.sender,
            message.text
        );


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    450
                )
        );

    }


    setTimeout(() => {

        continueButton.classList.add(
            "visible"
        );

    }, 700);
}


/* =========================================================
   GO TO QUIZ
========================================================= */

function goToQuiz() {

    stopRomanticBGM();

    tapSound();

    chatScreen.style.opacity =
        "0";


    setTimeout(() => {

        window.location.href =
            "quiz.html";

    }, 900);
}


/* =========================================================
   CONTINUE BUTTON
========================================================= */

continueButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        goToQuiz();

    }
);


/* =========================================================
   OPTIONAL TAP AFTER FINAL MESSAGE
========================================================= */

chatScreen.addEventListener(
    "click",
    event => {

        if (
            continueButton.classList.contains(
                "visible"
            ) &&
            event.target !==
            continueButton
        ) {

            goToQuiz();

        }

    }
);


/* =========================================================
   FIRST USER INTERACTION
   UNLOCK AUDIO
========================================================= */

document.addEventListener(
    "click",
    () => {

        const ctx =
            getAudio();

        if (
            ctx &&
            ctx.state === "suspended"
        ) {

            ctx.resume();

        }

    },
    {
        once: true
    }
);

</script>
