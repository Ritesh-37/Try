<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Still Dizzy... ❤️</title>

<style>

/* =========================================================
   SOFT WHITISH RED / PINK LUXURY PALETTE
========================================================= */

:root {
    --soft-white: #FFF8FA;
    --white: #FFFDFE;

    --blush-light: #FFE8EF;
    --blush: #F8C8D8;
    --pink: #E9A0B5;

    --rose: #D95C7A;
    --deep-rose: #9E294C;

    --wine: #6D1F3B;

    --text: #4A1728;
    --soft-text: #8D5367;

    --gold: #C9A96E;
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: var(--text);

    cursor: pointer;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,.95),
            transparent 35%
        ),

        radial-gradient(
            circle at 15% 80%,
            rgba(248,200,216,.55),
            transparent 32%
        ),

        radial-gradient(
            circle at 90% 15%,
            rgba(233,160,181,.35),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #FFF8FA,
            #FFE8EF 45%,
            #FFFDFE
        );
}


/* =========================================================
   MAIN WAKE SCREEN
========================================================= */

#wakeScreen {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    text-align: center;

    background:

        radial-gradient(
            circle at center,
            rgba(255,255,255,.8),
            transparent 45%
        ),

        linear-gradient(
            135deg,
            #FFF8FA,
            #FFE8EF,
            #FFFDFE
        );
}


/* =========================================================
   SOFT PINK VIGNETTE
========================================================= */

#wakeScreen::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 20;

    background:

        radial-gradient(
            ellipse at center,
            transparent 30%,
            rgba(157,42,76,.14) 100%
        );
}


/* =========================================================
   AMBIENT PINK LIGHT
========================================================= */

.ambient-light {

    position: absolute;

    width: 75vw;
    height: 75vw;

    max-width: 850px;
    max-height: 850px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.9),
            rgba(248,200,216,.35),
            transparent 70%
        );

    filter: blur(35px);

    animation:
        ambientBreath
        6s
        ease-in-out
        infinite
        alternate;

    pointer-events: none;
}


@keyframes ambientBreath {

    from {
        transform: scale(.82);
        opacity: .55;
    }

    to {
        transform: scale(1.12);
        opacity: 1;
    }
}


/* =========================================================
   CUTE FLOATING LIGHT PARTICLES
========================================================= */

.particles {

    position: absolute;

    inset: 0;

    pointer-events: none;

    z-index: 3;
}


.particle {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: var(--pink);

    box-shadow:
        0 0 12px
        rgba(217,92,122,.35);

    opacity: 0;

    animation:
        floatUp
        linear
        infinite;
}


.particle:nth-child(1) {
    left: 10%;
    bottom: -5%;
    animation-duration: 10s;
}

.particle:nth-child(2) {
    left: 25%;
    bottom: -5%;
    animation-duration: 13s;
    animation-delay: 2s;
}

.particle:nth-child(3) {
    left: 44%;
    bottom: -5%;
    animation-duration: 9s;
    animation-delay: 1s;
}

.particle:nth-child(4) {
    left: 67%;
    bottom: -5%;
    animation-duration: 12s;
    animation-delay: 3s;
}

.particle:nth-child(5) {
    left: 86%;
    bottom: -5%;
    animation-duration: 11s;
    animation-delay: 1s;
}


@keyframes floatUp {

    0% {
        transform:
            translateY(0)
            scale(.4);

        opacity: 0;
    }

    20% {
        opacity: .55;
    }

    70% {
        opacity: .3;
    }

    100% {
        transform:
            translateY(-110vh)
            translateX(35px)
            scale(1);

        opacity: 0;
    }
}


/* =========================================================
   CIRCULAR DIZZY MOTION
========================================================= */

.dizzy-ring {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 75vmin;
    height: 75vmin;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(217,92,122,.18);

    opacity: .8;

    pointer-events: none;

    animation:
        dizzySpin
        10s
        linear
        infinite;
}


.dizzy-ring::before {

    content: "";

    position: absolute;

    inset: 8%;

    border-radius: 50%;

    border:
        1px solid
        rgba(233,160,181,.25);

    animation:
        dizzySpinReverse
        7s
        linear
        infinite;
}


.dizzy-ring::after {

    content: "";

    position: absolute;

    inset: 20%;

    border-radius: 50%;

    border:
        1px dashed
        rgba(217,92,122,.15);

    animation:
        dizzySpin
        5s
        linear
        infinite;
}


@keyframes dizzySpin {

    from {
        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


@keyframes dizzySpinReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


/* =========================================================
   BLURRED ROOM / VISIBILITY LAYER
========================================================= */

.blur-layer {

    position: absolute;

    inset: -10px;

    z-index: 10;

    background:

        radial-gradient(
            circle at center,
            rgba(255,248,250,.78),
            rgba(255,232,239,.96)
        );

    backdrop-filter:
        blur(28px);

    -webkit-backdrop-filter:
        blur(28px);

    opacity: 1;

    transition:

        opacity 1.8s ease,

        backdrop-filter 1.5s ease,

        -webkit-backdrop-filter 1.5s ease;

    pointer-events: none;
}


/* =========================================================
   WAKE CONTENT
========================================================= */

.wake-content {

    position: relative;

    z-index: 15;

    width:
        min(90%, 650px);

    padding: 30px;

    transition:
        opacity .8s ease,
        transform .8s ease;
}


/* =========================================================
   SMALL ROMANTIC LABEL
========================================================= */

.eyebrow {

    color:
        var(--rose);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 22px;

    opacity: .65;
}


/* =========================================================
   DIALOGUE
========================================================= */

.dialogue {

    min-height: 110px;

    display: flex;

    align-items: center;

    justify-content: center;
}


.dialogue h1 {

    color:
        var(--text);

    font-size:
        clamp(
            31px,
            8vw,
            58px
        );

    font-weight: 500;

    line-height: 1.15;

    letter-spacing: .2px;

    text-shadow:
        0 3px 18px
        rgba(217,92,122,.13);

    animation:
        textAppear
        1.2s
        ease
        forwards;
}


@keyframes textAppear {

    from {

        opacity: 0;

        transform:
            translateY(15px)
            scale(.97);

        filter:
            blur(8px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter:
            blur(0);
    }
}


/* =========================================================
   TAP HINT
========================================================= */

.tap-hint {

    margin-top: 35px;

    color:
        var(--soft-text);

    font-size: 11px;

    letter-spacing: 2px;

    text-transform: uppercase;

    animation:
        hintPulse
        2s
        ease-in-out
        infinite;
}


@keyframes hintPulse {

    0%,
    100% {
        opacity: .35;
    }

    50% {
        opacity: .9;
    }
}


/* =========================================================
   TAP FLASH
========================================================= */

.tap-flash {

    position: fixed;

    inset: 0;

    background:

        radial-gradient(
            circle at center,
            rgba(255,255,255,.7),
            rgba(255,200,215,.12),
            transparent 60%
        );

    opacity: 0;

    pointer-events: none;

    z-index: 30;
}


.tap-flash.active {

    animation:
        tapFlash
        .55s
        ease;
}


@keyframes tapFlash {

    0% {
        opacity: 0;
    }

    25% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}


/* =========================================================
   TRANSITION RING
========================================================= */

.transition-ring {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    border:
        1px solid
        var(--rose);

    transform:
        translate(-50%, -50%)
        scale(0);

    opacity: 0;

    pointer-events: none;

    z-index: 50;
}


.transition-ring.active {

    animation:
        expandRing
        1.4s
        ease
        forwards;
}


@keyframes expandRing {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0);

        opacity: 0;
    }

    25% {
        opacity: .8;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(160);

        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px) {

    .wake-content {
        padding: 20px;
    }

    .eyebrow {
        letter-spacing: 3px;
    }

    .dizzy-ring {

        width: 95vmin;
        height: 95vmin;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     WAKE SCREEN
========================================================= -->

<section id="wakeScreen">


    <!-- Soft pink ambient glow -->

    <div class="ambient-light"></div>


    <!-- Circular dizzy effect -->

    <div class="dizzy-ring"></div>


    <!-- Floating particles -->

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>


    <!-- Blurred / faded room -->

    <div
        class="blur-layer"
        id="blurLayer">
    </div>


    <!-- Dialogue -->

    <div class="wake-content">

        <div class="eyebrow">
            Somewhere between midnight & forever
        </div>


        <div class="dialogue">

            <h1 id="dialogueText">
                Oh God! I'm still dizzy... 😵‍💫
            </h1>

        </div>


        <div
            class="tap-hint"
            id="tapHint">

            Tap anywhere to wake up

        </div>

    </div>

</section>


<!-- =========================================================
     TAP FLASH
========================================================= -->

<div
    class="tap-flash"
    id="tapFlash">
</div>


<!-- =========================================================
     TRANSITION RING
========================================================= -->

<div
    class="transition-ring"
    id="transitionRing">
</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const wakeScreen =
    document.getElementById("wakeScreen");

const blurLayer =
    document.getElementById("blurLayer");

const dialogueText =
    document.getElementById("dialogueText");

const tapHint =
    document.getElementById("tapHint");

const tapFlash =
    document.getElementById("tapFlash");

const transitionRing =
    document.getElementById("transitionRing");


/* =========================================================
   WAKE STATES
========================================================= */

let tapCount = 0;


/*
    TAP 0
    ↓
    Oh God! I'm still dizzy...

    TAP 1
    ↓
    Riteshhhhhhh!!! Babe!!!!

    TAP 2
    ↓
    Babyyyy!!! Where are you?

    TAP 3
    ↓
    Where are you hiding, Ritesh...?
*/

const dialogueStates = [

    "Oh God! I'm still dizzy... 😵‍💫",

    "Riteshhhhhhh!!! Babe!!!! ❤️",

    "Babyyyy!!! Where are you? 🥺",

    "Where are you hiding, Ritesh...? ❤️"

];


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {
            return null;
        }

        audioContext =
            new AudioContext();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    return audioContext;
}


/* =========================================================
   SOFT CLICK
========================================================= */

function clickSound() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        460,
        ctx.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        680,
        ctx.currentTime + .08
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .055,
        ctx.currentTime + .015
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .25
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + .25
    );
}


/* =========================================================
   DIZZY WHOOSH
========================================================= */

function dizzyWhoosh() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";


    oscillator.frequency.setValueAtTime(
        180,
        ctx.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        70,
        ctx.currentTime + .7
    );


    gain.gain.setValueAtTime(
        .0001,
        ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .08,
        ctx.currentTime + .12
    );


    gain.gain.exponentialRampToValueAtTime(
        .0001,
        ctx.currentTime + .8
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start();

    oscillator.stop(
        ctx.currentTime + .8
    );
}


/* =========================================================
   ROMANTIC TRANSITION SOUND
========================================================= */

function transitionSound() {

    const ctx =
        getAudioContext();

    if (!ctx) return;


    const notes = [
        392,
        523,
        659
    ];


    notes.forEach(
        (frequency, index) => {

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();


            oscillator.type =
                "sine";


            oscillator.frequency.value =
                frequency;


            const start =
                ctx.currentTime +
                index * .09;


            gain.gain.setValueAtTime(
                .0001,
                start
            );


            gain.gain.exponentialRampToValueAtTime(
                .045,
                start + .03
            );


            gain.gain.exponentialRampToValueAtTime(
                .0001,
                start + .45
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start(start);

            oscillator.stop(
                start + .45
            );

        }
    );
}


/* =========================================================
   SCREEN FLASH
========================================================= */

function flashScreen() {

    tapFlash.classList.remove(
        "active"
    );

    void tapFlash.offsetWidth;

    tapFlash.classList.add(
        "active"
    );
}


/* =========================================================
   CHANGE DIALOGUE
========================================================= */

function changeDialogue(text) {

    dialogueText.style.opacity =
        "0";

    dialogueText.style.transform =
        "translateY(12px) scale(.98)";

    dialogueText.style.filter =
        "blur(6px)";


    setTimeout(() => {

        dialogueText.textContent =
            text;


        dialogueText.style.transition =
            "all .9s ease";


        dialogueText.style.opacity =
            "1";


        dialogueText.style.transform =
            "translateY(0) scale(1)";


        dialogueText.style.filter =
            "blur(0)";

    }, 250);
}


/* =========================================================
   SCREEN TAP
========================================================= */

wakeScreen.addEventListener(
    "click",
    () => {

        tapCount++;

        clickSound();

        flashScreen();


        /* =================================================
           FIRST TAP
        ================================================= */

        if (tapCount === 1) {

            dizzyWhoosh();

            changeDialogue(
                dialogueStates[1]
            );


            blurLayer.style.opacity =
                ".68";


            tapHint.textContent =
                "Tap again...";
        }


        /* =================================================
           SECOND TAP
        ================================================= */

        else if (tapCount === 2) {

            transitionSound();

            changeDialogue(
                dialogueStates[2]
            );


            blurLayer.style.opacity =
                ".34";


            tapHint.textContent =
                "Almost there...";
        }


        /* =================================================
           THIRD TAP
        ================================================= */

        else if (tapCount === 3) {

            transitionSound();

            changeDialogue(
                dialogueStates[3]
            );


            blurLayer.style.opacity =
                "0";


            tapHint.textContent =
                "I'm awake... ❤️";


            /*
                Dizziness gradually slows
            */

            document
                .querySelector(".dizzy-ring")
                .style.animationDuration =
                "22s";


            /*
                Cinematic transition
            */

            setTimeout(() => {

                transitionRing.classList.add(
                    "active"
                );

            }, 900);

        }

    }
);

</script>

</body>
</html>
